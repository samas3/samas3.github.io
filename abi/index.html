        // ---- 射击 ----
        function playerShoot(angle) {
            const p = game.player;
            if (game.shootCooldown > 0) return;
            if (game.over || game.victory) return;

            const isBigEyeSoy = p.shortRange && p.soyMilk;
            let bulletLife = 100;
            if (p.shortRange) bulletLife = 50;
            if (p.basketball) bulletLife *= 2;

            let bulletRadius = BULLET_RADIUS;
            if (p.shortRange) bulletRadius *= 2;
            if (p.soyMilk) bulletRadius *= 0.5;
            if (p.holyLight && p.shortRange) bulletRadius *= 2;
            if (p.holyLight && p.scytheActive) bulletRadius *= 2;

            const shootBullet = (ang, dmg) => {
                let damage = dmg || p.atk;
                let color = '#ffd93d';
                let needleProb = p.needle ? (p.holyLight ? 0.15 : 0.05) : 0;
                let isNeedle = false;
                if (Math.random() < needleProb) {
                    const mult = p.soyMilk ? 12 : 8;
                    damage *= mult;
                    color = '#333';
                    isNeedle = true;
                }
                if (p.knockbackBullet) {
                    damage += p.knockbackDamageBonus || 0;
                }
                const bullet = {
                    x: p.x + Math.cos(ang) * (p.radius + 4),
                    y: p.y + Math.sin(ang) * (p.radius + 4),
                    vx: Math.cos(ang) * BULLET_SPEED,
                    vy: Math.sin(ang) * BULLET_SPEED,
                    radius: bulletRadius,
                    damage: damage,
                    life: bulletLife,
                    friendly: true,
                    color: color,
                    pierceRemain: p.scytheActive ? 999 : p.pierceUp,
                    homing: p.homing,
                    explosive: p.explosiveBullet,
                    slow: p.slowBullet && !(p.burnBullet && p.slowBullet),
                    burn: p.burnBullet,
                    knockback: p.knockbackBullet,
                    angle: ang,
                    scythe: p.scytheActive,
                    rot: 0,
                    isScytheBigEye: p.scytheActive && p.shortRange,
                    returnToPlayer: false,
                    hoverTimer: 0,
                    auraRadius: (p.holyLight && p.homing) ? bulletRadius * 2 : 0,
                    auraDamage: (p.holyLight && p.homing) ? p.atk : 0,
                    auraTimer: 0,
                    bounceCount: 0,
                    maxBounces: 10,
                    basketball: p.basketball,
                    bounceDamageMult: 1,
                    bounceRadiusMult: 1,
                    needle: isNeedle, // 标记是否为针头子弹
                };
                game.bullets.push(bullet);
            };

            if (isBigEyeSoy) {
                const spread = 0.3;
                for (let i = -1; i <= 1; i++) {
                    const a = angle + i * spread;
                    shootBullet(a, p.baseAtk);
                }
            } else {
                shootBullet(angle);
            }

            game.shootCooldown = p.shootDelay;

            for (let i = 0; i < 4; i++) {
                game.particles.push({
                    x: p.x + Math.cos(angle) * (p.radius + 2),
                    y: p.y + Math.sin(angle) * (p.radius + 2),
                    vx: Math.cos(angle + rand(-0.5, 0.5)) * rand(1, 3),
                    vy: Math.sin(angle + rand(-0.5, 0.5)) * rand(1, 3),
                    life: 12 + rand(0, 8),
                    maxLife: 20,
                    radius: rand(2, 4),
                    color: '#ffd93d',
                });
            }
        }

        // ---- 敌人 AI ----
        function updateEnemy(e, dt) {
            if (e.hp <= 0) return;
            const p = game.player;
            const dx = p.x - e.x;
            const dy = p.y - e.y;
            const d = Math.hypot(dx, dy);

            e.damageResetTimer += dt;
            if (e.damageResetTimer >= 1) {
                e.damageResetTimer = 0;
                e.damageCounter = 0;
            }

            if (e.hitCooldown > 0) e.hitCooldown -= dt;
            if (e.hurtTimer > 0) e.hurtTimer -= dt;
            if (e.slowTimer > 0) e.slowTimer -= dt;
            if (e.burnTimer > 0) {
                e.burnTimer -= dt;
                e.burnTickTimer += dt;
                if (e.burnTickTimer >= 0.5) {
                    e.burnTickTimer = 0;
                    e.hp -= e.burnDamage;
                }
            }
            let speedFactor = e.slowTimer > 0 ? 0.5 : 1;
            if (e.slowTimer > 0 && p.slowBullet && p.holyLight) {
                speedFactor = 0;
            }

            if (e.isTankLimit) {
                const limit = e.maxHp / 5;
                if (e.damageCounter > limit) {
                    // 实际在碰撞中限制
                }
            }

            // ---- 最终Boss阶段1：静止，多种慢速弹幕 ----
            if (e.finalPhase1) {
                e.skillTimer -= dt * 60;
                if (e.skillTimer <= 0) {
                    // 随机选择弹幕模式
                    const pattern = randInt(0, 3);
                    if (pattern === 0) {
                        // 环形：数量减少到6，慢速
                        const count = 6;
                        const speed = 1.2;
                        const life = 350;
                        for (let i = 0; i < count; i++) {
                            const a = (i / count) * Math.PI * 2 + game.frame * 0.01;
                            game.enemyBullets.push({
                                x: e.x + Math.cos(a) * (e.radius + 6),
                                y: e.y + Math.sin(a) * (e.radius + 6),
                                vx: Math.cos(a) * speed,
                                vy: Math.sin(a) * speed,
                                radius: 5,
                                damage: 1,
                                color: '#ff6b6b',
                                life: life,
                            });
                        }
                    } else if (pattern === 1) {
                        // 扇形散射：数量减少
                        const count = 6;
                        const spread = 0.8;
                        for (let i = 0; i < count; i++) {
                            const a = Math.atan2(dy, dx) - spread/2 + (i / (count-1)) * spread + rand(-0.1, 0.1);
                            game.enemyBullets.push({
                                x: e.x + Math.cos(a) * (e.radius + 6),
                                y: e.y + Math.sin(a) * (e.radius + 6),
                                vx: Math.cos(a) * (1.5 + rand(-0.2, 0.2)),
                                vy: Math.sin(a) * (1.5 + rand(-0.2, 0.2)),
                                radius: 5,
                                damage: 1,
                                color: '#ff6b6b',
                                life: 280,
                            });
                        }
                    } else if (pattern === 2) {
                        // 追踪弹：少量
                        const count = 2;
                        for (let i = 0; i < count; i++) {
                            const a = rand(0, Math.PI * 2);
                            const speed = 1.0;
                            game.enemyBullets.push({
                                x: e.x + Math.cos(a) * (e.radius + 6),
                                y: e.y + Math.sin(a) * (e.radius + 6),
                                vx: Math.cos(a) * speed,
                                vy: Math.sin(a) * speed,
                                radius: 6,
                                damage: 1,
                                color: '#ff6b6b',
                                life: 400,
                                homing: true,
                                target: p,
                                turnSpeed: 0.015,
                            });
                        }
                    } else if (pattern === 3) {
                        // 大型慢速弹：1发
                        const a = Math.atan2(dy, dx) + rand(-0.5, 0.5);
                        game.enemyBullets.push({
                            x: e.x + Math.cos(a) * (e.radius + 6),
                            y: e.y + Math.sin(a) * (e.radius + 6),
                            vx: Math.cos(a) * 0.7,
                            vy: Math.sin(a) * 0.7,
                            radius: 12,
                            damage: 2,
                            color: '#ffa502',
                            life: 450,
                        });
                    }
                    e.skillTimer = 40 + randInt(0, 20); // 0.7~1秒
                }
                // 边界
                e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                // 碰撞玩家
                if (d < p.radius + e.radius && p.invincible <= 0) {
                    if (p.hasShield && p.shieldCharges > 0 && p.shieldCooldown <= 0) {
                        p.shieldCharges--;
                        p.shieldCooldown = 900;
                        p.invincible = p.holyLight ? 90 : 60;
                        triggerShieldBreakEffects();
                        for (let i = 0; i < 20; i++) {
                            game.particles.push({
                                x: p.x,
                                y: p.y,
                                vx: rand(-5, 5),
                                vy: rand(-5, 5),
                                life: 20 + rand(0, 15),
                                maxLife: 35,
                                radius: rand(3, 7),
                                color: '#00d2ff',
                            });
                        }
                        const ang = Math.atan2(dy, dx);
                        e.x += Math.cos(ang) * 30;
                        e.y += Math.sin(ang) * 30;
                        return;
                    }
                    if (p.hasShield && p.holyLight && Math.random() < 0.3) {
                        p.invincible = 10;
                        return;
                    }
                    p.hp -= e.damage;
                    p.invincible = p.holyLight ? 90 : 60;
                    const angle = Math.atan2(dy, dx);
                    p.x -= Math.cos(angle) * 20;
                    p.y -= Math.sin(angle) * 20;
                    for (let i = 0; i < 12; i++) {
                        game.particles.push({
                            x: p.x,
                            y: p.y,
                            vx: rand(-3, 3),
                            vy: rand(-3, 3),
                            life: 25 + rand(0, 15),
                            maxLife: 40,
                            radius: rand(3, 6),
                            color: '#ff4757',
                        });
                    }
                    if (p.hp <= 0) {
                        p.hp = 0;
                        gameOver();
                    }
                }
                return;
            }

            // ---- 普通敌人类型 ----
            if (e.type === 'ranged') {
                const idealDist = 200;
                if (d < idealDist - 20) {
                    const ang = Math.atan2(dy, dx);
                    e.x -= Math.cos(ang) * e.speed * speedFactor * dt * 60;
                    e.y -= Math.sin(ang) * e.speed * speedFactor * dt * 60;
                } else if (d > idealDist + 20) {
                    const ang = Math.atan2(dy, dx);
                    e.x += Math.cos(ang) * e.speed * speedFactor * dt * 60;
                    e.y += Math.sin(ang) * e.speed * speedFactor * dt * 60;
                } else {
                    e.angle += (Math.random() - 0.5) * 0.02;
                    e.x += Math.cos(e.angle) * e.speed * 0.3 * dt * 60;
                    e.y += Math.sin(e.angle) * e.speed * 0.3 * dt * 60;
                }
                if (e.shootCooldown <= 0 && d < 400) {
                    const ang = Math.atan2(dy, dx);
                    let bulletSpeed = 3.5;
                    if (e.slowTimer > 0) bulletSpeed *= 0.6;
                    game.enemyBullets.push({
                        x: e.x + Math.cos(ang) * (e.radius + 4),
                        y: e.y + Math.sin(ang) * (e.radius + 4),
                        vx: Math.cos(ang) * bulletSpeed,
                        vy: Math.sin(ang) * bulletSpeed,
                        radius: 6,
                        damage: 1,
                        color: '#ff6b81',
                        life: 120,
                    });
                    e.shootCooldown = e.shootInterval || 80;
                } else {
                    e.shootCooldown -= dt * 60;
                }
            } else if (e.type === 'blue_bullet') {
                if (e.shootCooldown <= 0) {
                    const dirs = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
                    let bulletSpeed = 3.0;
                    if (e.slowTimer > 0) bulletSpeed *= 0.6;
                    for (const ang of dirs) {
                        game.enemyBullets.push({
                            x: e.x + Math.cos(ang) * (e.radius + 4),
                            y: e.y + Math.sin(ang) * (e.radius + 4),
                            vx: Math.cos(ang) * bulletSpeed,
                            vy: Math.sin(ang) * bulletSpeed,
                            radius: 5,
                            damage: 1,
                            color: '#00bfff',
                            life: 100,
                        });
                    }
                    e.shootCooldown = e.shootInterval || 100;
                } else {
                    e.shootCooldown -= dt * 60;
                }
                e.x += Math.sin(game.frame * 0.01 + e.x) * 0.1;
                e.y += Math.cos(game.frame * 0.01 + e.y) * 0.1;
            } else if (e.type === 'stationary') {
                if (e.shootCooldown <= 0 && d < 400) {
                    let angle;
                    const absDX = Math.abs(dx);
                    const absDY = Math.abs(dy);
                    if (absDX > absDY) {
                        angle = dx > 0 ? 0 : Math.PI;
                    } else {
                        angle = dy > 0 ? Math.PI/2 : 3*Math.PI/2;
                    }
                    angle += rand(-0.1, 0.1);
                    let bulletSpeed = 3.2;
                    if (e.slowTimer > 0) bulletSpeed *= 0.6;
                    game.enemyBullets.push({
                        x: e.x + Math.cos(angle) * (e.radius + 4),
                        y: e.y + Math.sin(angle) * (e.radius + 4),
                        vx: Math.cos(angle) * bulletSpeed,
                        vy: Math.sin(angle) * bulletSpeed,
                        radius: 6,
                        damage: 1,
                        color: '#ff6b81',
                        life: 110,
                    });
                    e.shootCooldown = e.shootInterval || 90;
                } else {
                    e.shootCooldown -= dt * 60;
                }
            } else if (e.isFanShooter) {
                if (e.shootCooldown <= 0 && d < 400) {
                    const count = 8;
                    const spread = 1.0;
                    for (let i = 0; i < count; i++) {
                        const a = Math.atan2(dy, dx) - spread/2 + (i / (count-1)) * spread + rand(-0.05, 0.05);
                        let bulletSpeed = 3.0;
                        if (e.slowTimer > 0) bulletSpeed *= 0.6;
                        game.enemyBullets.push({
                            x: e.x + Math.cos(a) * (e.radius + 4),
                            y: e.y + Math.sin(a) * (e.radius + 4),
                            vx: Math.cos(a) * bulletSpeed,
                            vy: Math.sin(a) * bulletSpeed,
                            radius: 5,
                            damage: 1,
                            color: '#e67e22',
                            life: 160,
                        });
                    }
                    e.shootCooldown = e.shootInterval || 200;
                } else {
                    e.shootCooldown -= dt * 60;
                }
                e.x += Math.sin(game.frame * 0.005 + e.x) * 0.2;
                e.y += Math.cos(game.frame * 0.005 + e.y) * 0.2;
            } else if (e.isBouncer) {
                const speed = e.speed * speedFactor * dt * 60;
                e.x += Math.cos(e.bounceAngle) * speed;
                e.y += Math.sin(e.bounceAngle) * speed;
                if (e.x < ROOM_PAD + e.radius || e.x > W - ROOM_PAD - e.radius) {
                    e.bounceAngle = Math.PI - e.bounceAngle;
                    e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                    if (e.isBoss && e.bossType === 'bounce' && e.enhance >= 4) {
                        const count = 8 + Math.floor(e.enhance);
                        for (let i = 0; i < count; i++) {
                            const a = (i / count) * Math.PI * 2;
                            game.enemyBullets.push({
                                x: e.x + Math.cos(a) * (e.radius + 4),
                                y: e.y + Math.sin(a) * (e.radius + 4),
                                vx: Math.cos(a) * 2.5,
                                vy: Math.sin(a) * 2.5,
                                radius: 5,
                                damage: 1,
                                color: '#8e44ad',
                                life: 80,
                            });
                        }
                    }
                }
                if (e.y < ROOM_PAD + e.radius || e.y > H - ROOM_PAD - e.radius) {
                    e.bounceAngle = -e.bounceAngle;
                    e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                    if (e.isBoss && e.bossType === 'bounce' && e.enhance >= 4) {
                        const count = 8 + Math.floor(e.enhance);
                        for (let i = 0; i < count; i++) {
                            const a = (i / count) * Math.PI * 2;
                            game.enemyBullets.push({
                                x: e.x + Math.cos(a) * (e.radius + 4),
                                y: e.y + Math.sin(a) * (e.radius + 4),
                                vx: Math.cos(a) * 2.5,
                                vy: Math.sin(a) * 2.5,
                                radius: 5,
                                damage: 1,
                                color: '#8e44ad',
                                life: 80,
                            });
                        }
                    }
                }
            } else {
                if (d > 2 && e.state !== 'hurt' && !e.isBoss) {
                    const speed = e.speed * speedFactor * (1 + (Math.min(game.wave, MAX_WAVE_FOR_SPEED) - 1) * 0.015);
                    const step = Math.min(speed * dt * 60, d);
                    e.x += (dx / d) * step;
                    e.y += (dy / d) * step;
                    e.angle = Math.atan2(dy, dx);
                }
            }

            // ---- Boss AI ----
            if (e.isBoss) {
                const hpRatio = e.hp / e.maxHp;
                let speedMultBoss = 1;
                if (hpRatio < 0.5) speedMultBoss = 1.5;

                // 阶段3最终Boss：复杂混合
                if (e.finalPhase3) {
                    if (d > 2) {
                        const step = Math.min(e.speed * speedFactor * 0.5 * dt * 60, d);
                        e.x += (dx / d) * step;
                        e.y += (dy / d) * step;
                        e.angle = Math.atan2(dy, dx);
                    }
                    e.skillTimer -= dt * 60;
                    if (e.skillTimer <= 0) {
                        const skills = ['ring', 'scatter', 'tracking', 'laser_beam', 'explode', 'summon'];
                        const count = 1 + (hpRatio < 0.5 ? 1 : 0);
                        for (let c = 0; c < count; c++) {
                            const chosen = skills[randInt(0, skills.length - 1)];
                            executeBossSkill(e, chosen);
                        }
                        e.skillTimer = 60 + randInt(0, 30);
                    }
                    e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                    e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                    if (d < p.radius + e.radius && p.invincible <= 0) {
                        if (p.hasShield && p.shieldCharges > 0 && p.shieldCooldown <= 0) {
                            p.shieldCharges--;
                            p.shieldCooldown = 900;
                            p.invincible = p.holyLight ? 90 : 60;
                            triggerShieldBreakEffects();
                            for (let i = 0; i < 20; i++) {
                                game.particles.push({
                                    x: p.x,
                                    y: p.y,
                                    vx: rand(-5, 5),
                                    vy: rand(-5, 5),
                                    life: 20 + rand(0, 15),
                                    maxLife: 35,
                                    radius: rand(3, 7),
                                    color: '#00d2ff',
                                });
                            }
                            const ang = Math.atan2(dy, dx);
                            e.x += Math.cos(ang) * 30;
                            e.y += Math.sin(ang) * 30;
                            return;
                        }
                        if (p.hasShield && p.holyLight && Math.random() < 0.3) {
                            p.invincible = 10;
                            return;
                        }
                        p.hp -= e.damage;
                        p.invincible = p.holyLight ? 90 : 60;
                        const angle = Math.atan2(dy, dx);
                        p.x -= Math.cos(angle) * 20;
                        p.y -= Math.sin(angle) * 20;
                        for (let i = 0; i < 12; i++) {
                            game.particles.push({
                                x: p.x,
                                y: p.y,
                                vx: rand(-3, 3),
                                vy: rand(-3, 3),
                                life: 25 + rand(0, 15),
                                maxLife: 40,
                                radius: rand(3, 6),
                                color: '#ff4757',
                            });
                        }
                        if (p.hp <= 0) {
                            p.hp = 0;
                            gameOver();
                        }
                    }
                    return;
                }

                // 普通boss逻辑（包括阶段2的加强boss）
                if (e.bossType === 'laser') {
                    e.x += Math.cos(e.angle || 0) * e.speed * 0.5 * dt * 60 * speedMultBoss;
                    e.y += Math.sin(e.angle || 0) * e.speed * 0.5 * dt * 60 * speedMultBoss;
                    e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                    e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                    if (Math.random() < 0.01) {
                        e.angle = (e.angle || 0) + (Math.random() > 0.5 ? 1 : -1) * Math.PI / 2;
                    }
                    e.skillTimer -= dt * 60;
                    if (e.skillTimer <= 0) {
                        const skills = ['ring', 'scatter', 'tracking', 'laser_beam'];
                        const chosen = skills[randInt(0, skills.length - 1)];
                        let lifeMult = 1;
                        if (e.enhance >= 4) lifeMult = 1.5;
                        if (chosen === 'laser_beam') {
                            const dirs = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
                            for (const ang of dirs) {
                                for (let i = 0; i < 10; i++) {
                                    const offset = (i - 4.5) * 0.06;
                                    const a = ang + offset;
                                    const speed = 8 + game.wave * 0.1;
                                    const life = 60 * lifeMult;
                                    const bullet = {
                                        x: e.x + Math.cos(a) * (e.radius + 4),
                                        y: e.y + Math.sin(a) * (e.radius + 4),
                                        vx: Math.cos(a) * speed,
                                        vy: Math.sin(a) * speed,
                                        radius: 4,
                                        damage: 1,
                                        color: '#00ffff',
                                        life: life,
                                        bounce: (e.enhance >= 4) ? true : false,
                                    };
                                    game.enemyBullets.push(bullet);
                                }
                            }
                        } else {
                            executeBossSkill(e, chosen);
                        }
                        e.skillTimer = e.skillInterval * (0.6 + Math.random() * 0.4);
                    }
                } else if (e.bossType === 'bounce') {
                    const speed = e.speed * speedFactor * dt * 60 * speedMultBoss;
                    e.x += Math.cos(e.bounceAngle) * speed;
                    e.y += Math.sin(e.bounceAngle) * speed;
                    if (e.x < ROOM_PAD + e.radius || e.x > W - ROOM_PAD - e.radius) {
                        e.bounceAngle = Math.PI - e.bounceAngle;
                        e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                        if (e.enhance >= 4) {
                            const count = 8 + Math.floor(e.enhance);
                            for (let i = 0; i < count; i++) {
                                const a = (i / count) * Math.PI * 2;
                                game.enemyBullets.push({
                                    x: e.x + Math.cos(a) * (e.radius + 4),
                                    y: e.y + Math.sin(a) * (e.radius + 4),
                                    vx: Math.cos(a) * 2.5,
                                    vy: Math.sin(a) * 2.5,
                                    radius: 5,
                                    damage: 1,
                                    color: '#8e44ad',
                                    life: 80,
                                });
                            }
                        }
                    }
                    if (e.y < ROOM_PAD + e.radius || e.y > H - ROOM_PAD - e.radius) {
                        e.bounceAngle = -e.bounceAngle;
                        e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                        if (e.enhance >= 4) {
                            const count = 8 + Math.floor(e.enhance);
                            for (let i = 0; i < count; i++) {
                                const a = (i / count) * Math.PI * 2;
                                game.enemyBullets.push({
                                    x: e.x + Math.cos(a) * (e.radius + 4),
                                    y: e.y + Math.sin(a) * (e.radius + 4),
                                    vx: Math.cos(a) * 2.5,
                                    vy: Math.sin(a) * 2.5,
                                    radius: 5,
                                    damage: 1,
                                    color: '#8e44ad',
                                    life: 80,
                                });
                            }
                        }
                    }
                    e.bounceAngle = Math.round(e.bounceAngle / (Math.PI/4)) * (Math.PI/4);
                    e.damage = 3;
                } else {
                    // normal boss
                    if (e.isCharging) {
                        e.chargeTimer -= dt * 60;
                        const chargeSpeed = 8 * speedMultBoss;
                        e.x += Math.cos(e.chargeAngle) * chargeSpeed * dt * 60;
                        e.y += Math.sin(e.chargeAngle) * chargeSpeed * dt * 60;
                        if (e.chargeTimer <= 0) {
                            e.isCharging = false;
                            e.speed = ENEMY_SPEED_BASE * (0.35 + Math.min(game.wave, MAX_WAVE_FOR_SPEED) * 0.006);
                        }
                        e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                        e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                    } else {
                        e.skillTimer -= dt * 60;
                        if (e.skillTimer <= 0) {
                            const skills = ['ring', 'summon', 'scatter', 'charge', 'tracking', 'explode'];
                            if (hpRatio < 0.5) {
                                skills.push('charge', 'charge', 'explode');
                            }
                            if (e.enhance >= 4) {
                                skills.push('summon', 'summon');
                            }
                            const chosen = skills[randInt(0, skills.length - 1)];
                            executeBossSkill(e, chosen);
                            e.skillTimer = e.skillInterval * (0.6 + Math.random() * 0.4);
                        }
                    }
                    if (!e.isCharging) {
                        if (d > 2) {
                            const speed = e.speed * speedFactor * speedMultBoss * (1 + (Math.min(game.wave, MAX_WAVE_FOR_SPEED) - 1) * 0.015);
                            const step = Math.min(speed * dt * 60, d);
                            e.x += (dx / d) * step;
                            e.y += (dy / d) * step;
                            e.angle = Math.atan2(dy, dx);
                        }
                    }
                }
            }

            // 边界
            if (!e.isBoss || (e.isBoss && e.bossType !== 'bounce')) {
                if (!e.isBouncer) {
                    e.x = clamp(e.x, ROOM_PAD + e.radius, W - ROOM_PAD - e.radius);
                    e.y = clamp(e.y, ROOM_PAD + e.radius, H - ROOM_PAD - e.radius);
                }
            }

            // 碰撞玩家
            if (d < p.radius + e.radius && p.invincible <= 0) {
                if (p.hasShield && p.shieldCharges > 0 && p.shieldCooldown <= 0) {
                    p.shieldCharges--;
                    p.shieldCooldown = 900;
                    p.invincible = p.holyLight ? 90 : 60;
                    triggerShieldBreakEffects();
                    for (let i = 0; i < 20; i++) {
                        game.particles.push({
                            x: p.x,
                            y: p.y,
                            vx: rand(-5, 5),
                            vy: rand(-5, 5),
                            life: 20 + rand(0, 15),
                            maxLife: 35,
                            radius: rand(3, 7),
                            color: '#00d2ff',
                        });
                    }
                    const ang = Math.atan2(dy, dx);
                    e.x += Math.cos(ang) * 30;
                    e.y += Math.sin(ang) * 30;
                    return;
                }
                if (p.hasShield && p.holyLight && Math.random() < 0.3) {
                    p.invincible = 10;
                    return;
                }
                p.hp -= e.damage;
                p.invincible = p.holyLight ? 90 : 60;
                const angle = Math.atan2(dy, dx);
                p.x -= Math.cos(angle) * 20;
                p.y -= Math.sin(angle) * 20;
                for (let i = 0; i < 12; i++) {
                    game.particles.push({
                        x: p.x,
                        y: p.y,
                        vx: rand(-3, 3),
                        vy: rand(-3, 3),
                        life: 25 + rand(0, 15),
                        maxLife: 40,
                        radius: rand(3, 6),
                        color: '#ff4757',
                    });
                }
                if (p.hp <= 0) {
                    p.hp = 0;
                    gameOver();
                }
            }
        }

        // ---- 护盾破碎连携 ----
        function triggerShieldBreakEffects() {
            const p = game.player;
            const playerPos = { x: p.x, y: p.y };
            if (p.hasShield && p.burnBullet) {
                for (const e of game.enemies) {
                    if (e.hp <= 0) continue;
                    if (dist(playerPos, e) < 200) {
                        e.burnTimer = 120;
                        e.burnDamage = Math.max(1, Math.floor(p.atk * 0.5));
                        e.burnTickTimer = 0;
                    }
                }
            }
            if (p.hasShield && p.knockbackBullet) {
                for (const e of game.enemies) {
                    if (e.hp <= 0) continue;
                    if (dist(playerPos, e) < 180) {
                        const ang = Math.atan2(e.y - p.y, e.x - p.x);
                        e.x += Math.cos(ang) * 40;
                        e.y += Math.sin(ang) * 40;
                    }
                }
            }
            if (p.slowBullet && p.hasShield) {
                for (const e of game.enemies) {
                    if (e.hp <= 0) continue;
                    if (dist(playerPos, e) < 150) {
                        e.slowTimer = 60;
                    }
                }
            }
            if (p.explosiveBullet && p.hasShield) {
                const damage = p.atk * 2;
                for (const e of game.enemies) {
                    if (e.hp <= 0) continue;
                    if (dist(playerPos, e) < 120) {
                        e.hp -= damage;
                        e.hitCooldown = 10;
                        e.hurtTimer = 15;
                        const ang = Math.atan2(e.y - p.y, e.x - p.x);
                        e.x += Math.cos(ang) * 20;
                        e.y += Math.sin(ang) * 20;
                        for (let k = 0; k < 10; k++) {
                            game.particles.push({
                                x: e.x,
                                y: e.y,
                                vx: rand(-4, 4),
                                vy: rand(-4, 4),
                                life: 20 + rand(0, 10),
                                maxLife: 30,
                                radius: rand(2, 5),
                                color: '#ffa502',
                            });
                        }
                    }
                }
            }
        }

        // ---- Boss技能执行 ----
        function executeBossSkill(boss, skill) {
            const p = game.player;
            const dx = p.x - boss.x;
            const dy = p.y - boss.y;
            const d = Math.hypot(dx, dy);
            const ang = Math.atan2(dy, dx);
            switch (skill) {
                case 'ring': {
                    const count = 10 + Math.floor(game.wave / 5);
                    for (let i = 0; i < count; i++) {
                        const a = (i / count) * Math.PI * 2 + rand(-0.1, 0.1);
                        game.enemyBullets.push({
                            x: boss.x + Math.cos(a) * (boss.radius + 6),
                            y: boss.y + Math.sin(a) * (boss.radius + 6),
                            vx: Math.cos(a) * (2.5 + game.wave * 0.02),
                            vy: Math.sin(a) * (2.5 + game.wave * 0.02),
                            radius: 5,
                            damage: 1,
                            color: '#ff6b6b',
                            life: 120,
                        });
                    }
                    break;
                }
                case 'summon': {
                    let count = 1 + Math.floor(game.wave / 15);
                    if (boss.enhance >= 4) {
                        count = 2 + Math.floor(game.wave / 10);
                    }
                    for (let i = 0; i < count; i++) {
                        const a = rand(0, Math.PI * 2);
                        const dist2 = 60 + rand(0, 30);
                        const sx = boss.x + Math.cos(a) * dist2;
                        const sy = boss.y + Math.sin(a) * dist2;
                        let subType = 'normal';
                        if (boss.enhance >= 4 && Math.random() < 0.3) {
                            subType = 'ranged';
                        }
                        const mini = {
                            x: sx,
                            y: sy,
                            radius: ENEMY_RADIUS * 0.7,
                            hp: Math.ceil(boss.maxHp * 0.15),
                            maxHp: Math.ceil(boss.maxHp * 0.15),
                            speed: boss.speed * 0.8,
                            damage: 1,
                            hitCooldown: 0,
                            angle: 0,
                            state: 'chase',
                            hurtTimer: 0,
                            type: subType,
                            color: subType === 'ranged' ? '#3498db' : '#e67e22',
                            shootCooldown: subType === 'ranged' ? 40 + randInt(0, 20) : 0,
                            shootInterval: subType === 'ranged' ? 80 + randInt(0, 40) : 0,
                            slowTimer: 0,
                            slowFactor: 1,
                            burnTimer: 0,
                            burnDamage: 0,
                            burnTickTimer: 0,
                            damageCounter: 0,
                            damageResetTimer: 0,
                        };
                        game.enemies.push(mini);
                    }
                    break;
                }
                case 'scatter': {
                    const count = 8 + Math.floor(game.wave / 3);
                    const spread = 0.6;
                    for (let i = 0; i < count; i++) {
                        const a = ang - spread/2 + (i / (count-1)) * spread + rand(-0.05, 0.05);
                        game.enemyBullets.push({
                            x: boss.x + Math.cos(a) * (boss.radius + 6),
                            y: boss.y + Math.sin(a) * (boss.radius + 6),
                            vx: Math.cos(a) * (3.5 + game.wave * 0.02),
                            vy: Math.sin(a) * (3.5 + game.wave * 0.02),
                            radius: 5,
                            damage: 1,
                            color: '#ff6b6b',
                            life: 100,
                        });
                    }
                    break;
                }
                case 'charge': {
                    boss.isCharging = true;
                    boss.chargeTimer = 60 + randInt(0, 20);
                    boss.chargeAngle = ang;
                    boss.speed = 0;
                    break;
                }
                case 'tracking': {
                    const count = 4 + Math.floor(game.wave / 8);
                    for (let i = 0; i < count; i++) {
                        const a = rand(0, Math.PI * 2);
                        const speed = 2 + game.wave * 0.015;
                        const bullet = {
                            x: boss.x + Math.cos(a) * (boss.radius + 6),
                            y: boss.y + Math.sin(a) * (boss.radius + 6),
                            vx: Math.cos(a) * speed,
                            vy: Math.sin(a) * speed,
                            radius: 6,
                            damage: 1,
                            color: '#ff6b6b',
                            life: 150,
                            homing: true,
                            target: p,
                            turnSpeed: 0.04,
                        };
                        game.enemyBullets.push(bullet);
                    }
                    break;
                }
                case 'explode': {
                    const radius = 80 + game.wave * 0.5;
                    const hasSlow = game.player.slowBullet;
                    const hasBigEye = game.player.shortRange;
                    const finalRadius = hasBigEye ? radius * 1.8 : radius;
                    for (const other of game.enemies) {
                        if (other === boss || other.hp <= 0) continue;
                        if (dist(boss, other) < finalRadius) {
                            let dmg = boss.damage * 2;
                            if (game.player.burnBullet) {
                                other.burnTimer = 120;
                                other.burnDamage = Math.max(1, Math.floor(boss.damage * 0.5));
                                other.burnTickTimer = 0;
                            }
                            other.hp -= dmg;
                            other.hitCooldown = 10;
                            other.hurtTimer = 15;
                            const ang2 = Math.atan2(other.y - boss.y, other.x - boss.x);
                            other.x += Math.cos(ang2) * 20;
                            other.y += Math.sin(ang2) * 20;
                            if (hasSlow) {
                                other.slowTimer = 60;
                            }
                        }
                    }
                    if (d < finalRadius && p.invincible <= 0) {
                        if (p.hasShield && p.shieldCharges > 0 && p.shieldCooldown <= 0) {
                            p.shieldCharges--;
                            p.shieldCooldown = 900;
                            p.invincible = p.holyLight ? 90 : 30;
                            triggerShieldBreakEffects();
                        } else {
                            p.hp -= 2;
                            p.invincible = p.holyLight ? 90 : 60;
                            const ang2 = Math.atan2(dy, dx);
                            p.x -= Math.cos(ang2) * 30;
                            p.y -= Math.sin(ang2) * 30;
                            if (p.hp <= 0) {
                                p.hp = 0;
                                gameOver();
                            }
                        }
                    }
                    for (let i = 0; i < 40; i++) {
                        game.particles.push({
                            x: boss.x,
                            y: boss.y,
                            vx: rand(-8, 8),
                            vy: rand(-8, 8),
                            life: 30 + rand(0, 20),
                            maxLife: 50,
                            radius: rand(4, 10),
                            color: '#ff4500',
                        });
                    }
                    break;
                }
            }
        }

        // ---- 碰撞检测 ----
        function checkCollisions() {
            const { bullets, enemyBullets, enemies, player } = game;
            const p = game.player;

            // ---- 火焰尾迹阻挡弹幕 ----
            if (game.fireTrails.length > 0) {
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const eb = enemyBullets[i];
                    let blocked = false;
                    for (const trail of game.fireTrails) {
                        if (dist(eb, trail) < 30) {
                            blocked = true;
                            break;
                        }
                    }
                    if (blocked) {
                        enemyBullets.splice(i, 1);
                    }
                }
            }

            // 玩家子弹 vs 敌人
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (!b.friendly) continue;
                let bulletUsed = false;
                if (b.auraRadius > 0) {
                    b.auraTimer += 1;
                    if (b.auraTimer >= 6) {
                        b.auraTimer = 0;
                        for (const e of enemies) {
                            if (e.hp <= 0) continue;
                            if (dist(b, e) < b.auraRadius) {
                                e.hp -= b.auraDamage;
                                e.hitCooldown = 2;
                                e.hurtTimer = 5;
                            }
                        }
                    }
                }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (e.hp <= 0) continue;
                    const isBounceBoss = e.isBoss && e.bossType === 'bounce';
                    const isBouncer = e.isBouncer;
                    if (dist(b, e) < b.radius + e.radius) {
                        if (p.knockbackBullet && p.holyLight && Math.random() < 0.02) {
                            e.hp = 0;
                        } else {
                            let damage = b.damage;
                            // Boss穿透无效（除镰刀外）
                            if (e.isBoss && !b.scythe && b.pierceRemain > 0) {
                                b.pierceRemain = 0;
                            }
                            if (e.isBoss) {
                                const limit = e._limitPerSecond || (e.maxHp / 2);
                                if (e.damageCounter + damage > limit) {
                                    damage = Math.max(0, limit - e.damageCounter);
                                }
                                e.damageCounter += damage;
                            } else if (e.isTankLimit) {
                                const limit = e.maxHp / 5;
                                if (e.damageCounter + damage > limit) {
                                    damage = Math.max(0, limit - e.damageCounter);
                                }
                                e.damageCounter += damage;
                            }
                            e.hp -= damage;
                        }
                        e.hitCooldown = 8;
                        e.hurtTimer = 10;
                        if (!isBounceBoss && !isBouncer) {
                            const knockAngle = Math.atan2(b.vy, b.vx);
                            const knockForce = b.knockback ? 18 : 4;
                            e.x += Math.cos(knockAngle) * knockForce;
                            e.y += Math.sin(knockAngle) * knockForce;
                        }
                        if (b.slow) e.slowTimer = 60;
                        if (b.burn) {
                            e.burnTimer = 120;
                            e.burnDamage = Math.max(1, Math.floor(b.damage * 0.3));
                            e.burnTickTimer = 0;
                        }
                        if (b.explosive) {
                            let explodeRadius = 50;
                            if (p.shortRange) explodeRadius = 90;
                            const hasSlow = p.slowBullet;
                            const hasBurn = p.burnBullet;
                            for (const other of enemies) {
                                if (other === e || other.hp <= 0) continue;
                                if (dist(b, other) < explodeRadius) {
                                    let dmg2 = b.damage * 1.2;
                                    if (other.isBoss) {
                                        const limit2 = other._limitPerSecond || (other.maxHp / 2);
                                        if (other.damageCounter + dmg2 > limit2) {
                                            dmg2 = Math.max(0, limit2 - other.damageCounter);
                                        }
                                        other.damageCounter += dmg2;
                                    } else if (other.isTankLimit) {
                                        const limit2 = other.maxHp / 5;
                                        if (other.damageCounter + dmg2 > limit2) {
                                            dmg2 = Math.max(0, limit2 - other.damageCounter);
                                        }
                                        other.damageCounter += dmg2;
                                    }
                                    other.hp -= dmg2;
                                    other.hitCooldown = 8;
                                    other.hurtTimer = 10;
                                    const ang2 = Math.atan2(other.y - b.y, other.x - b.x);
                                    other.x += Math.cos(ang2) * 6;
                                    other.y += Math.sin(ang2) * 6;
                                    if (hasSlow) other.slowTimer = 60;
                                    if (hasBurn) {
                                        other.burnTimer = 120;
                                        other.burnDamage = Math.max(1, Math.floor(b.damage * 0.3));
                                        other.burnTickTimer = 0;
                                    }
                                }
                            }
                            for (let k = 0; k < 30; k++) {
                                game.particles.push({
                                    x: b.x,
                                    y: b.y,
                                    vx: rand(-6, 6),
                                    vy: rand(-6, 6),
                                    life: 20 + rand(0, 15),
                                    maxLife: 35,
                                    radius: rand(3, 8),
                                    color: '#ffa502',
                                });
                            }
                        }
                        for (let k = 0; k < 10; k++) {
                            game.particles.push({
                                x: b.x,
                                y: b.y,
                                vx: rand(-4, 4),
                                vy: rand(-4, 4),
                                life: 20 + rand(0, 10),
                                maxLife: 30,
                                radius: rand(2, 5),
                                color: '#ff6b6b',
                            });
                        }
                        if (e.hp <= 0) {
                            // 圣光+爆炸
                            if (p.holyLight && p.explosiveBullet) {
                                const explodeRadius = 80;
                                for (const other of enemies) {
                                    if (other === e || other.hp <= 0) continue;
                                    if (dist(e, other) < explodeRadius) {
                                        let dmg3 = p.atk * 1.5;
                                        if (other.isBoss) {
                                            const limit3 = other._limitPerSecond || (other.maxHp / 2);
                                            if (other.damageCounter + dmg3 > limit3) {
                                                dmg3 = Math.max(0, limit3 - other.damageCounter);
                                            }
                                            other.damageCounter += dmg3;
                                        } else if (other.isTankLimit) {
                                            const limit3 = other.maxHp / 5;
                                            if (other.damageCounter + dmg3 > limit3) {
                                                dmg3 = Math.max(0, limit3 - other.damageCounter);
                                            }
                                            other.damageCounter += dmg3;
                                        }
                                        other.hp -= dmg3;
                                        other.hitCooldown = 10;
                                        other.hurtTimer = 15;
                                        const ang2 = Math.atan2(other.y - e.y, other.x - e.x);
                                        other.x += Math.cos(ang2) * 20;
                                        other.y += Math.sin(ang2) * 20;
                                    }
                                }
                                for (let k = 0; k < 30; k++) {
                                    game.particles.push({
                                        x: e.x,
                                        y: e.y,
                                        vx: rand(-6, 6),
                                        vy: rand(-6, 6),
                                        life: 20 + rand(0, 15),
                                        maxLife: 35,
                                        radius: rand(3, 8),
                                        color: '#ffa502',
                                    });
                                }
                            }
                            if (e.isSplitter && !e._splitDone) {
                                e._splitDone = true;
                                for (let k = 0; k < 3; k++) {
                                    const ang = rand(0, Math.PI * 2);
                                    const dist2 = 30 + rand(0, 20);
                                    const sx = e.x + Math.cos(ang) * dist2;
                                    const sy = e.y + Math.sin(ang) * dist2;
                                    const child = {
                                        x: sx,
                                        y: sy,
                                        radius: ENEMY_RADIUS * 0.8,
                                        hp: Math.ceil(e.maxHp * 0.4),
                                        maxHp: Math.ceil(e.maxHp * 0.4),
                                        speed: ENEMY_SPEED_BASE * (0.75 + rand(0, 0.2)),
                                        damage: 1,
                                        hitCooldown: 0,
                                        angle: 0,
                                        state: 'chase',
                                        hurtTimer: 0,
                                        type: 'ranged',
                                        color: '#3498db',
                                        shootCooldown: 40 + randInt(0, 20),
                                        shootInterval: 80 + randInt(0, 40),
                                        slowTimer: 0,
                                        slowFactor: 1,
                                        burnTimer: 0,
                                        burnDamage: 0,
                                        burnTickTimer: 0,
                                        damageCounter: 0,
                                        damageResetTimer: 0,
                                    };
                                    game.enemies.push(child);
                                }
                            }
                            game.kills++;
                            for (let k = 0; k < 20; k++) {
                                game.particles.push({
                                    x: e.x,
                                    y: e.y,
                                    vx: rand(-5, 5),
                                    vy: rand(-5, 5),
                                    life: 30 + rand(0, 20),
                                    maxLife: 50,
                                    radius: rand(2, 6),
                                    color: e.color || '#e74c3c',
                                });
                            }
                            // 最终Boss阶段转换检查
                            if (e.finalPhase1) {
                                startFinalBossPhase2();
                            } else if (e.finalPhase2) {
                                game.finalPhase2Count--;
                                if (game.finalPhase2Count <= 0) {
                                    startFinalBossPhase3();
                                }
                            } else if (e.finalPhase3) {
                                victory();
                            } else {
                                // 普通Boss掉落
                                if (e.isBoss) {
                                    if (p.holyLight && p.fishingNet && Math.random() < 0.5) {
                                        spawnSpecialItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                                        spawnSpecialItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                                    } else {
                                        spawnSpecialItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                                    }
                                    for (let k = 0; k < 40; k++) {
                                        game.particles.push({
                                            x: e.x,
                                            y: e.y,
                                            vx: rand(-8, 8),
                                            vy: rand(-8, 8),
                                            life: 40 + rand(0, 30),
                                            maxLife: 70,
                                            radius: rand(3, 8),
                                            color: '#ffd700',
                                        });
                                    }
                                } else {
                                    let dropProb = 0.15 + game.wave * 0.005;
                                    if (game.wave <= 6) dropProb *= 2;
                                    if (game.wave > 40) dropProb *= 0.6;
                                    if (Math.random() < dropProb) {
                                        spawnItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                                    }
                                }
                            }
                            enemies.splice(j, 1);
                        }
                        // 篮球+拳头：命中敌人后反弹（针头子弹不反弹）
                        if (b.basketball && b.knockback && !b.needle && e.hp > 0) {
                            if (b.bounceCount < b.maxBounces) {
                                const angle = Math.atan2(b.vy, b.vx);
                                const normal = Math.atan2(e.y - b.y, e.x - b.x);
                                const diff = normal - angle;
                                const newAngle = angle + 2 * diff + Math.PI;
                                const speed = Math.hypot(b.vx, b.vy);
                                b.vx = Math.cos(newAngle) * speed;
                                b.vy = Math.sin(newAngle) * speed;
                                b.bounceCount++;
                                if (p.holyLight && p.basketball) {
                                    b.radius *= 2;
                                    b.damage *= 2;
                                }
                                continue;
                            }
                        }
                        if (b.scythe || b.pierceRemain > 0) {
                            if (!b.scythe) b.pierceRemain--;
                        } else {
                            bulletUsed = true;
                            break;
                        }
                    }
                }
                if (bulletUsed) {
                    bullets.splice(i, 1);
                }
            }

            // 敌对子弹 vs 玩家
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                if (eb.homing && eb.target) {
                    const dx = eb.target.x - eb.x;
                    const dy = eb.target.y - eb.y;
                    const d = Math.hypot(dx, dy);
                    if (d > 1) {
                        const targetAngle = Math.atan2(dy, dx);
                        let currentAngle = Math.atan2(eb.vy, eb.vx);
                        let diff = targetAngle - currentAngle;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        currentAngle += diff * (eb.turnSpeed || 0.04);
                        const speed = Math.hypot(eb.vx, eb.vy);
                        eb.vx = Math.cos(currentAngle) * speed;
                        eb.vy = Math.sin(currentAngle) * speed;
                    }
                }

                let bulletBlocked = false;
                if (game.ramPet) {
                    const pet = game.ramPet;
                    if (dist(eb, pet) < eb.radius + pet.radius) {
                        bulletBlocked = true;
                        for (let k = 0; k < 8; k++) {
                            game.particles.push({
                                x: eb.x,
                                y: eb.y,
                                vx: rand(-3, 3),
                                vy: rand(-3, 3),
                                life: 15 + rand(0, 10),
                                maxLife: 25,
                                radius: rand(2, 4),
                                color: '#00d2ff',
                            });
                        }
                    }
                }
                if (bulletBlocked) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (dist(eb, player) < eb.radius + player.radius && player.invincible <= 0) {
                    if (player.hasShield && player.shieldCharges > 0 && player.shieldCooldown <= 0) {
                        player.shieldCharges--;
                        player.shieldCooldown = 900;
                        player.invincible = player.holyLight ? 90 : 30;
                        triggerShieldBreakEffects();
                        for (let k = 0; k < 20; k++) {
                            game.particles.push({
                                x: player.x,
                                y: player.y,
                                vx: rand(-5, 5),
                                vy: rand(-5, 5),
                                life: 20 + rand(0, 15),
                                maxLife: 35,
                                radius: rand(3, 7),
                                color: '#00d2ff',
                            });
                        }
                        enemyBullets.splice(i, 1);
                        continue;
                    }
                    if (player.hasShield && player.holyLight && Math.random() < 0.3) {
                        player.invincible = 10;
                        enemyBullets.splice(i, 1);
                        continue;
                    }
                    player.hp -= eb.damage || 1;
                    player.invincible = player.holyLight ? 90 : 60;
                    const angle = Math.atan2(eb.vy, eb.vx);
                    player.x -= Math.cos(angle) * 15;
                    player.y -= Math.sin(angle) * 15;
                    for (let k = 0; k < 12; k++) {
                        game.particles.push({
                            x: player.x,
                            y: player.y,
                            vx: rand(-3, 3),
                            vy: rand(-3, 3),
                            life: 25 + rand(0, 15),
                            maxLife: 40,
                            radius: rand(3, 6),
                            color: '#ff4757',
                        });
                    }
                    enemyBullets.splice(i, 1);
                    if (player.hp <= 0) {
                        player.hp = 0;
                        gameOver();
                    }
                }
            }

            // 道具拾取
            const pickupRange = game.magnetRange || ITEM_RADIUS;
            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (dist(item, player) < item.radius + pickupRange) {
                    applyItem(item);
                    game.items.splice(i, 1);
                }
            }

            // 子弹超界与反弹（篮球）
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (b.hoverTimer > 0) {
                    b.hoverTimer -= 1;
                    if (b.hoverTimer <= 0) {
                        bullets.splice(i, 1);
                    }
                    continue;
                }
                // 篮球反弹（边界）：针头子弹不反弹
                if (b.basketball && !b.needle) {
                    let bounced = false;
                    if (b.x < ROOM_PAD + b.radius || b.x > W - ROOM_PAD - b.radius) {
                        b.vx = -b.vx;
                        b.x = clamp(b.x, ROOM_PAD + b.radius, W - ROOM_PAD - b.radius);
                        b.bounceCount++;
                        bounced = true;
                    }
                    if (b.y < ROOM_PAD + b.radius || b.y > H - ROOM_PAD - b.radius) {
                        b.vy = -b.vy;
                        b.y = clamp(b.y, ROOM_PAD + b.radius, H - ROOM_PAD - b.radius);
                        b.bounceCount++;
                        bounced = true;
                    }
                    if (bounced) {
                        if (game.player.holyLight && game.player.basketball) {
                            b.radius *= 2;
                            b.damage *= 2;
                        }
                        if (b.bounceCount > b.maxBounces) {
                            bullets.splice(i, 1);
                            continue;
                        }
                    }
                }
                if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
                    bullets.splice(i, 1);
                    continue;
                }
                b.life--;
                if (b.life <= 0) {
                    if (p.shortRange && p.hourglass && !p.scytheActive) {
                        b.hoverTimer = 60;
                        b.vx = 0;
                        b.vy = 0;
                        continue;
                    }
                    if (b.isScytheBigEye && !b.returnToPlayer) {
                        b.returnToPlayer = true;
                        const dx = p.x - b.x;
                        const dy = p.y - b.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 1) {
                            const ang = Math.atan2(dy, dx);
                            const speed = Math.hypot(b.vx, b.vy);
                            b.vx = Math.cos(ang) * speed * 1.2;
                            b.vy = Math.sin(ang) * speed * 1.2;
                            b.life = 60;
                        } else {
                            bullets.splice(i, 1);
                        }
                    } else {
                        bullets.splice(i, 1);
                    }
                }
            }
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                if (eb.bounce) {
                    if (eb.x < ROOM_PAD + eb.radius || eb.x > W - ROOM_PAD - eb.radius) {
                        eb.vx = -eb.vx;
                        eb.x = clamp(eb.x, ROOM_PAD + eb.radius, W - ROOM_PAD - eb.radius);
                    }
                    if (eb.y < ROOM_PAD + eb.radius || eb.y > H - ROOM_PAD - eb.radius) {
                        eb.vy = -eb.vy;
                        eb.y = clamp(eb.y, ROOM_PAD + eb.radius, H - ROOM_PAD - eb.radius);
                    }
                }
                if (eb.x < -20 || eb.x > W + 20 || eb.y < -20 || eb.y > H + 20) {
                    enemyBullets.splice(i, 1);
                }
                eb.life--;
                if (eb.life <= 0) enemyBullets.splice(i, 1);
            }
            // 道具寿命
            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (p.holyLight && p.hourglass) {
                    continue;
                }
                item.life--;
                if (item.life <= 0) {
                    if (p.fishingNet && p.explosiveBullet) {
                        const explodeRadius = 80;
                        for (const e of game.enemies) {
                            if (e.hp <= 0) continue;
                            if (dist(item, e) < explodeRadius) {
                                let dmg = 15;
                                if (e.isBoss) {
                                    const limit = e._limitPerSecond || (e.maxHp / 2);
                                    if (e.damageCounter + dmg > limit) {
                                        dmg = Math.max(0, limit - e.damageCounter);
                                    }
                                    e.damageCounter += dmg;
                                } else if (e.isTankLimit) {
                                    const limit = e.maxHp / 5;
                                    if (e.damageCounter + dmg > limit) {
                                        dmg = Math.max(0, limit - e.damageCounter);
                                    }
                                    e.damageCounter += dmg;
                                }
                                e.hp -= dmg;
                                e.hitCooldown = 10;
                                e.hurtTimer = 15;
                                const ang2 = Math.atan2(e.y - item.y, e.x - item.x);
                                e.x += Math.cos(ang2) * 20;
                                e.y += Math.sin(ang2) * 20;
                            }
                        }
                        for (let k = 0; k < 30; k++) {
                            game.particles.push({
                                x: item.x,
                                y: item.y,
                                vx: rand(-6, 6),
                                vy: rand(-6, 6),
                                life: 20 + rand(0, 15),
                                maxLife: 35,
                                radius: rand(3, 8),
                                color: '#ffa502',
                            });
                        }
                    }
                    game.items.splice(i, 1);
                }
            }
        }

        // ---- 游戏结束 ----
        function gameOver() {
            game.over = true;

            finalWave.textContent = game.wave;
            finalKills.textContent = game.kills;
