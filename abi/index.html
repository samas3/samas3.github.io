<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以撒的结合 · 终极强化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .game-wrapper {
            background: #16213e;
            padding: 16px 20px 20px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #2d2d44;
            cursor: crosshair;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            width: 800px;
            height: 600px;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px 4px 12px;
            color: #eee;
            font-size: 14px;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
            gap: 4px 10px;
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-top: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .info-bar .hearts {
            font-size: 24px;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255, 80, 80, 0.5);
            min-width: 100px;
        }
        .info-bar .stats {
            display: flex;
            gap: 14px;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .info-bar .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .info-bar .stats .stat-item .label {
            color: #aac4e0;
        }
        .info-bar .stats .stat-item .value {
            color: #fff;
            font-weight: 700;
        }
        .info-bar .special-badge {
            display: flex;
            gap: 6px;
            background: rgba(255, 215, 0, 0.12);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            font-size: 13px;
            flex-wrap: wrap;
        }
        .info-bar .special-badge .badge-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ffd93d;
        }
        .info-bar .controls-hint {
            font-size: 12px;
            color: #8899bb;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }
        .info-bar .controls-hint kbd {
            background: #2a2a4a;
            color: #dde;
            padding: 0 6px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid #444466;
        }
        .game-over-overlay,
        .victory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-over-overlay.show,
        .victory-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .game-over-overlay h1 {
            font-size: 52px;
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255, 50, 50, 0.6);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .victory-overlay h1 {
            font-size: 52px;
            color: #ffd93d;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .game-over-overlay .sub,
        .victory-overlay .sub {
            font-size: 20px;
            color: #ccd;
            margin-bottom: 20px;
        }
        .game-over-overlay .restart-btn,
        .victory-overlay .restart-btn {
            background: #e94560;
            border: none;
            color: white;
            font-size: 22px;
            font-weight: 700;
            padding: 14px 48px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.4);
            letter-spacing: 0.5px;
        }
        .victory-overlay .restart-btn {
            background: #f5a623;
            box-shadow: 0 8px 24px rgba(245, 166, 35, 0.4);
        }
        .game-over-overlay .restart-btn:hover {
            transform: scale(1.06);
            background: #ff6b81;
            box-shadow: 0 12px 32px rgba(233, 69, 96, 0.6);
        }
        .victory-overlay .restart-btn:hover {
            transform: scale(1.06);
            background: #ffc107;
            box-shadow: 0 12px 32px rgba(245, 166, 35, 0.6);
        }
        .canvas-wrap {
            position: relative;
            display: inline-block;
        }
        .wave-announce {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 36px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            letter-spacing: 3px;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 36px;
            border-radius: 16px;
            border: 2px solid rgba(255, 200, 100, 0.3);
        }
        .wave-announce.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
        .boss-announce {
            border-color: #ff6b6b !important;
            color: #ff6b6b !important;
            box-shadow: 0 0 60px rgba(255, 50, 50, 0.4) !important;
        }
        .final-boss-announce {
            border-color: #ffd700 !important;
            color: #ffd700 !important;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.6) !important;
            background: rgba(0,0,0,0.8) !important;
        }
        @media (max-width: 860px) {
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 800/600;
            }
            .game-wrapper {
                padding: 12px;
            }
            .info-bar {
                font-size: 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .info-bar .stats {
                justify-content: center;
            }
            .info-bar .controls-hint {
                font-size: 11px;
                text-align: center;
            }
            .special-badge {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div class="wave-announce" id="waveAnnounce">⚔️ 第 1 波 ⚔️</div>
            <div class="game-over-overlay" id="gameOverOverlay">
                <h1>💀 陨落</h1>
                <div class="sub">你坚持了 <span id="finalWave">0</span> 波 · 击杀 <span id="finalKills">0</span></div>
                <button class="restart-btn" id="restartBtn">🔄 重新开始</button>
            </div>
            <div class="victory-overlay" id="victoryOverlay">
                <h1>🏆 胜利！</h1>
                <div class="sub">你成功击败了最终Boss！<br>击杀总数：<span id="victoryKills">0</span></div>
                <button class="restart-btn" id="victoryRestartBtn">🔄 再来一局</button>
            </div>
        </div>
        <div class="info-bar">
            <div class="hearts" id="heartDisplay">❤️❤️❤️</div>
            <div class="stats" id="statsDisplay">
                <span class="stat-item"><span class="label">⚔️</span><span class="value" id="atkDisplay">1</span></span>
                <span class="stat-item"><span class="label">💨</span><span class="value" id="spdDisplay">3.2</span></span>
                <span class="stat-item"><span class="label">⚡</span><span class="value" id="rateDisplay">350</span></span>
                <span class="stat-item"><span class="label" id="pierceLabel">穿透</span><span class="value" id="pierceDisplay">0</span></span>
                <span class="stat-item"><span class="label">波</span><span class="value" id="waveDisplay">0</span></span>
                <span class="stat-item"><span class="label">击杀</span><span class="value" id="killDisplay">0</span></span>
            </div>
            <div class="special-badge" id="specialBadge">
                <span class="badge-item" id="shieldBadge" style="display:none;">🛡️ 护盾</span>
                <span class="badge-item" id="scytheBadge" style="display:none;">🌪️ 镰刀</span>
                <span class="badge-item" id="homingBadge" style="display:none;">🥄 弯勺</span>
                <span class="badge-item" id="petBadge" style="display:none;">🐕 猎犬</span>
                <span class="badge-item" id="ramPetBadge" style="display:none;">🐐 山羊</span>
                <span class="badge-item" id="slowBadge" style="display:none;">❄️ 冰霜</span>
                <span class="badge-item" id="explosiveBadge" style="display:none;">💥 爆炸</span>
                <span class="badge-item" id="burnBadge" style="display:none;">🔥 灼烧</span>
                <span class="badge-item" id="knockBadge" style="display:none;">✊ 拳头</span>
                <span class="badge-item" id="regenBadge" style="display:none;">🍼 胎盘</span>
                <span class="badge-item" id="magnetBadge" style="display:none;">🧲 磁铁</span>
                <span class="badge-item" id="soyBadge" style="display:none;">🥛 豆浆</span>
                <span class="badge-item" id="shortBadge" style="display:none;">👁️ 大眼</span>
                <span class="badge-item" id="needleBadge" style="display:none;">📌 针头</span>
                <span class="badge-item" id="holyBadge" style="display:none;">✨ 圣光</span>
                <span class="badge-item" id="hourglassBadge" style="display:none;">⏳ 沙漏</span>
                <span class="badge-item" id="fishingNetBadge" style="display:none;">🕸️ 渔网</span>
                <span class="badge-item" id="basketballBadge" style="display:none;">🏀 篮球</span>
            </div>
            <div class="controls-hint">
                <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 &nbsp;│&nbsp; <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>鼠标</kbd> 射击
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  🎮  以撒的结合 · 终极强化版
        //  最终版：修复针头+篮球，削弱最终Boss一阶段弹幕并增加种类
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800,
            H = 600;

        // ---- DOM 引用 ----
        const heartDisplay = document.getElementById('heartDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const killDisplay = document.getElementById('killDisplay');
        const atkDisplay = document.getElementById('atkDisplay');
        const spdDisplay = document.getElementById('spdDisplay');
        const rateDisplay = document.getElementById('rateDisplay');
        const pierceDisplay = document.getElementById('pierceDisplay');
        const pierceLabel = document.getElementById('pierceLabel');
        const shieldBadge = document.getElementById('shieldBadge');
        const scytheBadge = document.getElementById('scytheBadge');
        const homingBadge = document.getElementById('homingBadge');
        const petBadge = document.getElementById('petBadge');
        const ramPetBadge = document.getElementById('ramPetBadge');
        const slowBadge = document.getElementById('slowBadge');
        const explosiveBadge = document.getElementById('explosiveBadge');
        const burnBadge = document.getElementById('burnBadge');
        const knockBadge = document.getElementById('knockBadge');
        const regenBadge = document.getElementById('regenBadge');
        const magnetBadge = document.getElementById('magnetBadge');
        const soyBadge = document.getElementById('soyBadge');
        const shortBadge = document.getElementById('shortBadge');
        const needleBadge = document.getElementById('needleBadge');
        const holyBadge = document.getElementById('holyBadge');
        const hourglassBadge = document.getElementById('hourglassBadge');
        const fishingNetBadge = document.getElementById('fishingNetBadge');
        const basketballBadge = document.getElementById('basketballBadge');
        const waveAnnounce = document.getElementById('waveAnnounce');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const finalWave = document.getElementById('finalWave');
        const finalKills = document.getElementById('finalKills');
        const victoryKills = document.getElementById('victoryKills');
        const restartBtn = document.getElementById('restartBtn');
        const victoryRestartBtn = document.getElementById('victoryRestartBtn');

        // ---- 常量 ----
        const ROOM_PAD = 40;
        const PLAYER_RADIUS = 16;
        const ENEMY_RADIUS = 16;
        const BULLET_RADIUS = 5;
        const ITEM_RADIUS = 14;
        const PLAYER_SPEED_BASE = 3.2;
        const BULLET_SPEED = 7.5;
        const ENEMY_SPEED_BASE = 1.1;
        const SHOOT_DELAY_BASE = 350;
        const MAX_HP = 8;
        const ITEM_LIFETIME_DEFAULT = 300;
        const MAX_WAVE_FOR_SPEED = 20;
        const MAX_PETS = 2;
        const VICTORY_WAVE = 60;
        const MAGNET_RANGE_MULTIPLIER = 6;

        // ---- 工具 ----
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // ---- 游戏状态 ----
        let game = {};

        const ALL_SPECIAL_TYPES = [
            'shield', 'scythe', 'homing', 'pet', 'slow', 'explosive', 'burn', 'knockback',
            'regen', 'magnet', 'soy_milk', 'short_range', 'ram_pet', 'needle', 'holy_light',
            'hourglass', 'fishing_net', 'basketball'
        ];

        function resetGame() {
            game = {
                running: true,
                over: false,
                victory: false,
                wave: 0,
                kills: 0,
                enemies: [],
                bullets: [],
                enemyBullets: [],
                items: [],
                particles: [],
                spawnTimer: 0,
                waveDelay: 0,
                waveActive: false,
                announceTimer: 0,
                isBossWave: false,
                keys: { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false },
                mouse: { x: W / 2, y: H / 2, down: false },
                shootCooldown: 0,
                frame: 0,
                pets: [],
                ramPet: null,
                availableSpecialTypes: [...ALL_SPECIAL_TYPES],
                regenWaveCounter: 0,
                magnetRange: ITEM_RADIUS,
                soyMilk: false,
                shortRange: false,
                hourglass: false,
                fishingNet: false,
                basketball: false,
                itemLifeTime: ITEM_LIFETIME_DEFAULT,
                fireTrails: [],
                finalBossActive: false,
                finalPhase: 0,
                finalPhase2Count: 0,
            };

            game.player = {
                x: W / 2,
                y: H / 2,
                radius: PLAYER_RADIUS,
                hp: 3,
                maxHp: 3,
                atk: 1,
                baseAtk: 1,
                speed: PLAYER_SPEED_BASE,
                shootDelay: SHOOT_DELAY_BASE,
                baseShootDelay: SHOOT_DELAY_BASE,
                invincible: 0,
                angle: 0,
                hasShield: false,
                shieldCharges: 0,
                shieldCooldown: 0,
                scytheActive: false,
                homing: false,
                petCount: 0,
                slowBullet: false,
                explosiveBullet: false,
                burnBullet: false,
                knockbackBullet: false,
                regen: false,
                magnet: false,
                soyMilk: false,
                shortRange: false,
                ramPet: false,
                pierceUp: 0,
                needle: false,
                holyLight: false,
                hourglass: false,
                fishingNet: false,
                basketball: false,
                knockbackDamageBonus: 0,
                lastTrailPos: null,
            };

            giveRandomSpecialItem();
            startWave();
        }

        // ---- 开局随机特殊道具 ----
        function giveRandomSpecialItem() {
            const avail = game.availableSpecialTypes;
            if (avail.length === 0) return;
            const idx = randInt(0, avail.length - 1);
            const chosen = avail[idx];
            avail.splice(idx, 1);
            applySpecialEffect(chosen);
            const names = {
                shield: '🛡️ 护盾',
                scythe: '🌪️ 镰刀',
                homing: '🥄 弯勺',
                pet: '🐕 猎犬',
                ram_pet: '🐐 山羊',
                slow: '❄️ 冰霜',
                explosive: '💥 爆炸',
                burn: '🔥 灼烧',
                knockback: '✊ 拳头',
                regen: '🍼 胎盘',
                magnet: '🧲 磁铁',
                soy_milk: '🥛 豆浆',
                short_range: '👁️ 大眼',
                needle: '📌 针头',
                holy_light: '✨ 圣光',
                hourglass: '⏳ 沙漏',
                fishing_net: '🕸️ 渔网',
                basketball: '🏀 篮球'
            };
            showAnnounce(`✨ 开局获得：${names[chosen] || chosen}`, false);
        }

        function applySpecialEffect(type) {
            const p = game.player;
            switch (type) {
                case 'shield':
                    p.hasShield = true;
                    p.shieldCharges = 1;
                    p.shieldCooldown = 0;
                    break;
                case 'scythe':
                    if (p.soyMilk || p.basketball) return;
                    p.scytheActive = true;
                    p.atk = p.baseAtk * 3;
                    p.shootDelay = p.baseShootDelay * 3;
                    break;
                case 'homing':
                    p.homing = true;
                    break;
                case 'pet':
                    p.petCount = Math.min(p.petCount + 1, MAX_PETS);
                    initPets();
                    break;
                case 'ram_pet':
                    p.ramPet = true;
                    const cd = p.holyLight ? 90 : 180;
                    game.ramPet = {
                        x: p.x + 40,
                        y: p.y,
                        radius: 24,
                        angle: 0,
                        chargeTimer: cd,
                        chargeCooldown: cd,
                        speed: 6,
                        state: 'idle',
                        target: null,
                    };
                    break;
                case 'slow':
                    p.slowBullet = true;
                    break;
                case 'explosive':
                    p.explosiveBullet = true;
                    break;
                case 'burn':
                    p.burnBullet = true;
                    p.pierceUp += 1;
                    break;
                case 'knockback':
                    if (p.soyMilk) return;
                    p.knockbackBullet = true;
                    p.knockbackDamageBonus = 2;
                    break;
                case 'regen':
                    p.regen = true;
                    game.regenWaveCounter = 0;
                    break;
                case 'magnet':
                    p.magnet = true;
                    let baseRange = ITEM_RADIUS * MAGNET_RANGE_MULTIPLIER;
                    if (p.holyLight) baseRange *= 1.5;
                    game.magnetRange = baseRange;
                    break;
                case 'soy_milk':
                    p.soyMilk = true;
                    game.soyMilk = true;
                    if (p.scytheActive) {
                        p.scytheActive = false;
                        p.atk = p.baseAtk;
                        p.shootDelay = p.baseShootDelay;
                    }
                    if (p.knockbackBullet) {
                        p.knockbackBullet = false;
                        p.knockbackDamageBonus = 0;
                    }
                    if (p.holyLight) {
                        p.shootDelay = p.baseShootDelay * 0.2;
                    } else {
                        p.shootDelay = Math.max(100, p.baseShootDelay * 0.2);
                    }
                    p.atk = Math.max(1, p.baseAtk * 0.5);
                    break;
                case 'short_range':
                    p.shortRange = true;
                    game.shortRange = true;
                    if (p.soyMilk) {
                        // 大眼+豆浆
                    } else {
                        p.atk = p.baseAtk * 2;
                    }
                    break;
                case 'needle':
                    p.needle = true;
                    break;
                case 'holy_light':
                    p.holyLight = true;
                    if (p.ramPet && game.ramPet) {
                        game.ramPet.chargeCooldown = 90;
                        game.ramPet.chargeTimer = Math.min(game.ramPet.chargeTimer, 90);
                    }
                    if (p.magnet) {
                        game.magnetRange = ITEM_RADIUS * MAGNET_RANGE_MULTIPLIER * 1.5;
                    }
                    if (p.soyMilk) {
                        p.shootDelay = p.baseShootDelay * 0.2;
                    }
                    break;
                case 'hourglass':
                    p.hourglass = true;
                    game.hourglass = true;
                    game.itemLifeTime = 1200;
                    break;
                case 'fishing_net':
                    p.fishingNet = true;
                    game.fishingNet = true;
                    break;
                case 'basketball':
                    p.basketball = true;
                    game.basketball = true;
                    if (p.scytheActive) {
                        p.scytheActive = false;
                        p.atk = p.baseAtk;
                        p.shootDelay = p.baseShootDelay;
                    }
                    break;
            }
            updateSpecialBadges();
            updateStatsDisplay();
        }

        function initPets() {
            const p = game.player;
            game.pets = [];
            for (let i = 0; i < p.petCount; i++) {
                game.pets.push({
                    x: p.x + 30 + i * 25,
                    y: p.y - 20 + i * 10,
                    radius: 12,
                    angle: 0,
                    shootCooldown: 0,
                    shootDelay: 40,
                    speed: 2.5,
                });
            }
        }

        // ---- 波次系统 ----
        function startWave() {
            if (game.finalBossActive) return;

            game.wave++;
            game.waveActive = true;
            if (game.player.hasShield && game.player.shieldCooldown <= 0) {
                game.player.shieldCharges = 1;
            }

            const isBossWave = (game.wave % 10 === 0);
            game.isBossWave = isBossWave;

            let count = Math.min(3 + game.wave, 14);
            if (isBossWave) {
                count = Math.max(2, count - 2);
            }
            const effectiveWave = Math.min(game.wave, MAX_WAVE_FOR_SPEED);
            const speedMult = 1 + (effectiveWave - 1) * 0.028;

            const hpBaseMult = game.wave > 30 ? 0.7 : 0.5;
            const hpExtra = game.wave > 30 ? 2 : 0;

            for (let i = 0; i < count; i++) {
                let x, y, valid;
                let attempts = 0;
                do {
                    x = rand(ROOM_PAD + 40, W - ROOM_PAD - 40);
                    y = rand(ROOM_PAD + 40, H - ROOM_PAD - 40);
                    valid = dist({ x, y }, game.player) > 150;
                    for (const e of game.enemies) {
                        if (dist({ x, y }, e) < 60) valid = false;
                    }
                    attempts++;
                } while (!valid && attempts < 30);

                let type = 'normal';
                const r = Math.random();
                if (game.wave > 30) {
                    if (r < 0.05) type = 'splitter';
                    else if (r < 0.10) type = 'fan_shooter';
                    else if (r < 0.15) type = 'tank_limit';
                    else if (r < 0.20) type = 'bouncer';
                    else if (r < 0.32) type = 'ranged';
                    else if (r < 0.44) type = 'blue_bullet';
                    else if (r < 0.56) type = 'stationary';
                    else if (r < 0.66) type = 'fast';
                    else if (r < 0.76) type = 'tank';
                    else type = 'normal';
                } else {
                    if (game.wave > 2 && r < 0.12) type = 'fast';
                    else if (game.wave > 3 && r < 0.28) type = 'tank';
                    else if (game.wave > 4 && r < 0.38) type = 'ranged';
                    else if (game.wave > 5 && r < 0.48) type = 'blue_bullet';
                    else if (game.wave > 6 && r < 0.58) type = 'stationary';
                    else type = 'normal';
                }

                const baseHp = Math.ceil(game.wave * hpBaseMult) + 1 + hpExtra;
                let hp, radius, speed, damage, color, shootInterval, special = {};

                switch (type) {
                    case 'fast':
                        hp = Math.max(1, Math.floor(baseHp * 0.6));
                        radius = ENEMY_RADIUS * 0.8;
                        speed = ENEMY_SPEED_BASE * speedMult * 1.5;
                        damage = 1;
                        color = '#f39c12';
                        shootInterval = 0;
                        break;
                    case 'tank':
                        hp = Math.ceil(baseHp * 1.8);
                        radius = ENEMY_RADIUS * 1.4;
                        speed = ENEMY_SPEED_BASE * speedMult * 0.55;
                        damage = 2;
                        color = '#8e44ad';
                        shootInterval = 0;
                        break;
                    case 'ranged':
                        hp = Math.max(1, Math.floor(baseHp * 0.8));
                        radius = ENEMY_RADIUS * 0.9;
                        speed = ENEMY_SPEED_BASE * speedMult * 0.75;
                        damage = 1;
                        color = '#3498db';
                        shootInterval = 80 + randInt(0, 40);
                        break;
                    case 'blue_bullet':
                        hp = Math.max(1, Math.floor(baseHp * 0.7));
                        radius = ENEMY_RADIUS * 0.9;
                        speed = ENEMY_SPEED_BASE * 0.3;
                        damage = 1;
                        color = '#00bfff';
                        shootInterval = 100 + randInt(0, 50);
                        break;
                    case 'stationary':
                        hp = Math.max(1, Math.floor(baseHp * 0.9));
                        radius = ENEMY_RADIUS;
                        speed = 0;
                        damage = 1;
                        color = '#ff6b81';
                        shootInterval = 90 + randInt(0, 40);
                        break;
                    case 'splitter':
                        hp = Math.ceil(baseHp * 2.0);
                        radius = ENEMY_RADIUS * 1.6;
                        speed = ENEMY_SPEED_BASE * speedMult * 0.7;
                        damage = 1;
                        color = '#8e44ad';
                        shootInterval = 0;
                        special.isSplitter = true;
                        break;
                    case 'fan_shooter':
                        hp = Math.ceil(baseHp * 1.2);
                        radius = ENEMY_RADIUS;
                        speed = 0.5;
                        damage = 1;
                        color = '#e67e22';
                        shootInterval = 200;
                        special.isFanShooter = true;
                        break;
                    case 'tank_limit':
                        hp = Math.ceil(baseHp * 4.0);
                        radius = ENEMY_RADIUS * 2.0;
                        speed = 0.3;
                        damage = 2;
                        color = '#2c3e50';
                        shootInterval = 0;
                        special.isTankLimit = true;
                        special.damageCounter = 0;
                        special.damageResetTimer = 0;
                        special.limitPerSecond = hp / 5;
                        break;
                    case 'bouncer':
                        hp = Math.ceil(baseHp * 0.6);
                        radius = ENEMY_RADIUS * 0.8;
                        speed = 8 + game.wave * 0.1;
                        damage = 1;
                        color = '#f1c40f';
                        shootInterval = 0;
                        special.isBouncer = true;
                        special.bounceAngle = rand(0, Math.PI * 2);
                        break;
                    default:
                        hp = baseHp;
                        radius = ENEMY_RADIUS;
                        speed = ENEMY_SPEED_BASE * speedMult * (0.85 + rand(0, 0.25));
                        damage = 1;
                        color = '#e74c3c';
                        shootInterval = 0;
                        break;
                }

                const enemy = {
                    x,
                    y,
                    radius: radius,
                    hp: hp,
                    maxHp: hp,
                    speed: speed,
                    damage: damage,
                    hitCooldown: 0,
                    angle: rand(0, Math.PI * 2),
                    state: 'chase',
                    hurtTimer: 0,
                    type: type,
                    color: color,
                    shootCooldown: shootInterval > 0 ? randInt(0, shootInterval) : 0,
                    shootInterval: shootInterval,
                    slowTimer: 0,
                    slowFactor: 1,
                    burnTimer: 0,
                    burnDamage: 0,
                    burnTickTimer: 0,
                    damageCounter: 0,
                    damageResetTimer: 0,
                    isSplitter: special.isSplitter || false,
                    isFanShooter: special.isFanShooter || false,
                    isTankLimit: special.isTankLimit || false,
                    isBouncer: special.isBouncer || false,
                    bounceAngle: special.bounceAngle || 0,
                    limitPerSecond: special.limitPerSecond || Infinity,
                };
                game.enemies.push(enemy);
            }

            // Boss波次
            if (isBossWave) {
                let bx, by, valid;
                let attempts = 0;
                do {
                    bx = rand(ROOM_PAD + 60, W - ROOM_PAD - 60);
                    by = rand(ROOM_PAD + 60, H - ROOM_PAD - 60);
                    valid = dist({ x: bx, y: by }, game.player) > 200;
                    attempts++;
                } while (!valid && attempts < 40);

                const bossTypes = ['normal', 'laser', 'bounce'];
                const chosenType = bossTypes[randInt(0, bossTypes.length - 1)];

                let bossHp = Math.ceil(game.wave * 2.5) + 12;
                let bossRadius = ENEMY_RADIUS * 2.4;
                let bossSpeed = ENEMY_SPEED_BASE * (0.35 + Math.min(game.wave, MAX_WAVE_FOR_SPEED) * 0.006);
                let bossDamage = 2;
                let bossColor = '#ff4757';
                let bossSkillInterval = 120;

                if (game.wave === VICTORY_WAVE) {
                    bossHp *= 5;
                }

                let bossEnhance = 0;
                if (game.wave === 40 || game.wave === 50 || game.wave === 60) {
                    bossEnhance = game.wave / 10;
                }

                if (chosenType === 'laser') {
                    bossRadius = ENEMY_RADIUS * 1.6;
                    bossHp = Math.ceil(bossHp * 0.7);
                    bossSpeed = 1.0;
                    bossColor = '#00bfff';
                    bossSkillInterval = 90;
                } else if (chosenType === 'bounce') {
                    bossRadius = ENEMY_RADIUS * 2.0;
                    bossHp = Math.ceil(bossHp * 1.2);
                    bossSpeed = 5 + game.wave * 0.05;
                    bossColor = '#8e44ad';
                    bossSkillInterval = 0;
                }

                const boss = {
                    x: bx,
                    y: by,
                    radius: bossRadius,
                    hp: bossHp,
                    maxHp: bossHp,
                    speed: bossSpeed,
                    damage: bossDamage,
                    hitCooldown: 0,
                    angle: 0,
                    state: 'chase',
                    hurtTimer: 0,
                    type: 'boss',
                    color: bossColor,
                    isBoss: true,
                    skillTimer: (chosenType === 'laser') ? 120 : 0,
                    skillInterval: bossSkillInterval,
                    phase: 0,
                    slowTimer: 0,
                    slowFactor: 1,
                    burnTimer: 0,
                    burnDamage: 0,
                    burnTickTimer: 0,
                    chargeTimer: 0,
                    isCharging: false,
                    chargeAngle: 0,
                    damageCounter: 0,
                    damageResetTimer: 0,
                    bossType: chosenType,
                    bounceAngle: Math.PI / 4,
                    laserTimer: 0,
                    laserCooldown: 60,
                    enhance: bossEnhance,
                };
                if (game.wave === VICTORY_WAVE) {
                    boss._limitPerSecond = boss.maxHp / 10;
                } else {
                    boss._limitPerSecond = boss.maxHp / 2;
                }
                game.enemies.push(boss);
                showAnnounce(`👑 BOSS 降临！ 第 ${game.wave} 波 (${chosenType})`, true);
            } else {
                showAnnounce(`⚔️ 第 ${game.wave} 波 ⚔️`, false);
            }

            game.spawnTimer = 0;
        }

        function showAnnounce(text, isBoss = false, isFinal = false) {
            const el = waveAnnounce;
            el.textContent = text;
            el.classList.remove('show', 'boss-announce', 'final-boss-announce');
            if (isFinal) el.classList.add('final-boss-announce');
            else if (isBoss) el.classList.add('boss-announce');
            void el.offsetWidth;
            el.classList.add('show');
            game.announceTimer = 120;
        }

        function clearWave() {
            game.waveActive = false;
            if (game.finalBossActive) {
                game.waveDelay = 90;
                return;
            }
            if (game.player.regen && Math.random() < 0.75) {
                spawnItem(W / 2 + rand(-80, 80), H / 2 + rand(-80, 80), 'heart');
            }
            let heartProb = 0.33;
            if (game.player.fishingNet && game.player.regen) {
                heartProb = 0.50;
            }
            if (Math.random() < heartProb) {
                spawnItem(W / 2 + rand(-80, 80), H / 2 + rand(-80, 80), 'heart');
            }
            let dropProbNormal = 0.20;
            if (game.wave > 40) dropProbNormal = 0.12;
            if (Math.random() < dropProbNormal) {
                const types = ['dmg', 'speed', 'rate', 'hpup', 'pierceup'];
                let chosenType = 'heart';
                const r = Math.random();
                if (r < 0.02) {
                    chosenType = 'pierceup';
                } else {
                    const others = ['dmg', 'speed', 'rate', 'hpup'];
                    const weights = [1, 1, 1, 0.7];
                    let total = weights.reduce((a, b) => a + b, 0);
                    let r2 = Math.random() * total;
                    let cum = 0;
                    for (let i = 0; i < weights.length; i++) {
                        cum += weights[i];
                        if (r2 < cum) {
                            chosenType = others[i];
                            break;
                        }
                    }
                }
                spawnItem(W / 2 + rand(-120, 120), H / 2 + rand(-120, 120), chosenType);
            }
            game.waveDelay = 90;
        }

            const types = ['heart', 'dmg', 'speed', 'rate', 'hpup', 'pierceup'];

                scythe: '🌪️',
                homing: '🥄',
                pet: '🐕',
                ram_pet: '🐐',
                slow: '❄️',

                knockback: '✊',
                regen: '🍼',
                magnet: '🧲',
                soy_milk: '🥛',
                short_range: '👁️',
                needle: '📌',
                holy_light: '✨',
                hourglass: '⏳',
                fishing_net: '🕸️',

            };
            const lifeTime = game.hourglass ? 1200 : ITEM_LIFETIME_DEFAULT;

        function applyItem(item) {
            const p = game.player;
            if (item.special) {
                const type = item.specialType;
                const idx = game.availableSpecialTypes.indexOf(type);
                if (idx !== -1) {
                    game.availableSpecialTypes.splice(idx, 1);
                }
                applySpecialEffect(type);
                for (let i = 0; i < 20; i++) {
                    game.particles.push({
                        x: item.x,
                        y: item.y,
                        vx: rand(-4, 4),
                        vy: rand(-4, 4),
                        life: 40 + rand(0, 20),
                        maxLife: 60,
                        radius: rand(2, 6),
                        color: '#ffd700',
                    });
                }
                return;
            }
            if (item.type === 'heart') {
                if (p.regen && p.needle && Math.random() < 0.15) {
                    const offsets = [
                        { x: -20, y: 0 },
                        { x: 20, y: 0 },
                        { x: 0, y: -20 },
                        { x: 0, y: 20 }
                    ];
                    for (const off of offsets) {
                        const item2 = {
                            x: item.x + off.x,
                            y: item.y + off.y,
                            radius: ITEM_RADIUS,
                            type: 'heart',
                            color: '#ff4757',
                            symbol: '❤️',
                            bobPhase: rand(0, Math.PI * 2),
                            life: game.hourglass ? 1200 : ITEM_LIFETIME_DEFAULT,
                            special: false,
                        };
                        game.items.push(item2);
                    }
                    return;
                }
                if (p.hp < p.maxHp) p.hp++;
            } else {
                switch (item.type) {
                    case 'dmg':
                        p.atk += 1;
                        p.baseAtk += 1;
                        if (p.soyMilk) p.atk = Math.max(1, p.baseAtk * 0.5);
                        if (p.shortRange && !p.soyMilk) p.atk = p.baseAtk * 2;
                        if (p.scytheActive) p.atk = p.baseAtk * 3;
                        break;
                    case 'speed':
                        p.speed += 0.3;
                        break;
                    case 'rate':
                        const reduction = 13;
                        if (p.holyLight && p.soyMilk) {
                            p.shootDelay = Math.max(0, p.shootDelay - reduction);
                            p.baseShootDelay = Math.max(0, p.baseShootDelay - reduction);
                        } else {
                            p.shootDelay = Math.max(100, p.shootDelay - reduction);
                            p.baseShootDelay = Math.max(100, p.baseShootDelay - reduction);
                        }
                        if (p.scytheActive) p.shootDelay = p.baseShootDelay * 3;
                        if (p.soyMilk && !p.holyLight) p.shootDelay = Math.max(100, p.baseShootDelay * 0.2);
                        break;
                    case 'hpup':
                        if (p.maxHp < MAX_HP) {
                            p.maxHp++;
                            p.hp = Math.min(p.hp + 1, p.maxHp);
                        }
                        break;
                    case 'pierceup':
                        p.pierceUp += 1;
                        break;
                }
            }
            for (let i = 0; i < 16; i++) {
                game.particles.push({
                    x: item.x,
                    y: item.y,
                    vx: rand(-3, 3),
                    vy: rand(-3, 3),
                    life: 40 + rand(0, 20),
                    maxLife: 60,
                    radius: rand(2, 5),
                    color: item.color,
                });
            }
            updateStatsDisplay();
        }
