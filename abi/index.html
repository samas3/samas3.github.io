        function victory() {
            game.victory = true;
            game.running = false;
            victoryKills.textContent = game.kills;
            victoryOverlay.classList.add('show');
            game.enemies = [];
        }

        // ---- 更新 ----
        function update(dt) {
            if (game.over || game.victory) return;
            const p = game.player;
            const keys = game.keys;

            if (p.invincible > 0) p.invincible -= dt * 60;
            if (game.shootCooldown > 0) game.shootCooldown -= dt * 1000;
            if (p.shieldCooldown > 0) {
                p.shieldCooldown -= dt * 60;
                if (p.shieldCooldown <= 0 && p.hasShield) {
                    p.shieldCharges = 1;
                }
            }

            // ---- 移动 ----
            let mx = 0,
                my = 0;
            if (keys.w) my = -1;
            if (keys.s) my = 1;
            if (keys.a) mx = -1;
            if (keys.d) mx = 1;
            if (mx !== 0 && my !== 0) { mx *= 0.707;
                my *= 0.707; }
            const spd = p.speed * dt * 60;
            p.x += mx * spd;
            p.y += my * spd;
            p.x = clamp(p.x, ROOM_PAD + p.radius, W - ROOM_PAD - p.radius);
            p.y = clamp(p.y, ROOM_PAD + p.radius, H - ROOM_PAD - p.radius);

            // ---- 圣光+灼烧：火焰尾迹 ----
            if (p.holyLight && p.burnBullet) {
                const currentPos = { x: p.x, y: p.y };
                if (game.fireTrails.length === 0 || dist(currentPos, game.fireTrails[game.fireTrails.length - 1]) > 5) {
                    game.fireTrails.push({ x: p.x, y: p.y, life: 60 });
                    if (game.fireTrails.length > 200) game.fireTrails.shift();
                }
                for (let i = game.fireTrails.length - 1; i >= 0; i--) {
                    game.fireTrails[i].life -= dt * 60;
                    if (game.fireTrails[i].life <= 0) {
                        game.fireTrails.splice(i, 1);
                    }
                }
                for (const trail of game.fireTrails) {
                    for (const e of game.enemies) {
                        if (e.hp <= 0) continue;
                        if (dist(trail, e) < 30) {
                            e.burnTimer = 120;
                            e.burnDamage = Math.max(1, Math.floor(p.atk * 0.8));
                            e.burnTickTimer = 0;
                        }
                    }
                }
            }

            // ---- 朝向 ----
            if (keys.up || keys.down || keys.left || keys.right) {
                let ang = 0;
                if (keys.up) ang = -Math.PI / 2;
                if (keys.down) ang = Math.PI / 2;
                if (keys.left) ang = Math.PI;
                if (keys.right) ang = 0;
                if (keys.up && keys.right) ang = -Math.PI / 4;
                if (keys.up && keys.left) ang = -3 * Math.PI / 4;
                if (keys.down && keys.right) ang = Math.PI / 4;
                if (keys.down && keys.left) ang = 3 * Math.PI / 4;
                p.angle = ang;
            } else {
                const dx = game.mouse.x - p.x;
                const dy = game.mouse.y - p.y;
                if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                    p.angle = Math.atan2(dy, dx);
                }
            }

            // ---- 射击 ----
            let shootAng = null;
            if (keys.up) shootAng = -Math.PI / 2;
            else if (keys.down) shootAng = Math.PI / 2;
            else if (keys.left) shootAng = Math.PI;
            else if (keys.right) shootAng = 0;
            if (keys.up && keys.right) shootAng = -Math.PI / 4;
            else if (keys.up && keys.left) shootAng = -3 * Math.PI / 4;
            else if (keys.down && keys.right) shootAng = Math.PI / 4;
            else if (keys.down && keys.left) shootAng = 3 * Math.PI / 4;

            if (shootAng !== null) playerShoot(shootAng);
            if (game.mouse.down) {
                const dx = game.mouse.x - p.x;
                const dy = game.mouse.y - p.y;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    const ang = Math.atan2(dy, dx);
                    playerShoot(ang);
                }
            }

            // ---- 追踪、镰刀吸引等 ----
            for (const b of game.bullets) {
                if (b.homing && !b._homingTarget) {
                    let closest = null,
                        minDist = Infinity;
                    for (const e of game.enemies) {
                        if (e.hp <= 0) continue;
                        const d = dist(b, e);
                        if (d < minDist) {
                            minDist = d;
                            closest = e;
                        }
                    }
                    if (closest) {
                        b._homingTarget = closest;
                    }
                }
                if (b.homing && b._homingTarget) {
                    const target = b._homingTarget;
                    if (target.hp > 0) {
                        const dx = target.x - b.x;
                        const dy = target.y - b.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 1) {
                            const ang = Math.atan2(dy, dx);
                            const speed = Math.hypot(b.vx, b.vy);
                            const turnSpeed = 0.08;
                            let currentAngle = Math.atan2(b.vy, b.vx);
                            let diff = ang - currentAngle;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            currentAngle += diff * turnSpeed;
                            b.vx = Math.cos(currentAngle) * speed;
                            b.vy = Math.sin(currentAngle) * speed;
                        }
                    } else {
                        b._homingTarget = null;
                    }
                }
                if (b.scythe) {
                    b.rot = (b.rot || 0) + 0.15;
                    if (p.magnet) {
                        for (const e of game.enemies) {
                            if (e.hp <= 0) continue;
                            const d = dist(b, e);
                            if (d < 120 && d > 1) {
                                const force = 0.3;
                                const ang = Math.atan2(e.y - b.y, e.x - b.x);
                                e.x += Math.cos(ang) * force * dt * 60;
                                e.y += Math.sin(ang) * force * dt * 60;
                            }
                        }
                    }
                }
            }

            // ---- 更新敌人 ----
            for (const e of game.enemies) {
                updateEnemy(e, dt);
            }

            // 敌人间碰撞挤压
            for (let i = 0; i < game.enemies.length; i++) {
                for (let j = i + 1; j < game.enemies.length; j++) {
                    const a = game.enemies[i];
                    const b = game.enemies[j];
                    if (a.hp <= 0 || b.hp <= 0) continue;
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const d = Math.hypot(dx, dy);
                    const minDist = a.radius + b.radius;
                    if (d < minDist && d > 0.01) {
                        const overlap = (minDist - d) * 0.5;
                        const nx = dx / d;
                        const ny = dy / d;
                        a.x -= nx * overlap;
                        a.y -= ny * overlap;
                        b.x += nx * overlap;
                        b.y += ny * overlap;
                    }
                }
            }

            // ---- 子弹移动 ----
            for (const b of game.bullets) {
                if (b.hoverTimer > 0) continue;
                b.x += b.vx * dt * 60;
                b.y += b.vy * dt * 60;
            }
            for (const eb of game.enemyBullets) {
                eb.x += eb.vx * dt * 60;
                eb.y += eb.vy * dt * 60;
            }

            // ---- 粒子 ----
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const pt = game.particles[i];
                pt.x += pt.vx * dt * 60;
                pt.y += pt.vy * dt * 60;
                pt.life -= dt * 60;
                pt.vx *= 0.97;
                pt.vy *= 0.97;
                if (pt.life <= 0) game.particles.splice(i, 1);
            }

            // ---- 猎犬 ----
            const hasGoat = p.ramPet;
            const hasDog = p.petCount > 0;
            let goatPos = null;
            if (hasGoat && game.ramPet) {
                goatPos = { x: game.ramPet.x, y: game.ramPet.y };
            }
            if (p.petCount > 0) {
                for (const pet of game.pets) {
                    let targetPos;
                    if (hasGoat && goatPos) {
                        targetPos = goatPos;
                        pet.shootDelay = 25;
                    } else {
                        targetPos = p;
                        pet.shootDelay = 40;
                    }
                    const dx = targetPos.x - pet.x;
                    const dy = targetPos.y - pet.y;
                    const d = Math.hypot(dx, dy);
                    if (d > 40) {
                        const step = Math.min(pet.speed * dt * 60, d);
                        pet.x += (dx / d) * step;
                        pet.y += (dy / d) * step;
                    }
                    pet.shootCooldown -= dt * 60;
                    if (pet.shootCooldown <= 0) {
                        let target = null,
                            minD = Infinity;
                        for (const e of game.enemies) {
                            if (e.hp <= 0) continue;
                            const d2 = dist(pet, e);
                            if (d2 < minD) {
                                minD = d2;
                                target = e;
                            }
                        }
                        if (target && minD < 400) {
                            const ang = Math.atan2(target.y - pet.y, target.x - pet.x);
                            let petDamage = Math.max(1, Math.floor(p.atk * 0.5));
                            const bullet = {
                                x: pet.x + Math.cos(ang) * (pet.radius + 4),
                                y: pet.y + Math.sin(ang) * (pet.radius + 4),
                                vx: Math.cos(ang) * 5,
                                vy: Math.sin(ang) * 5,
                                radius: 4,
                                damage: petDamage,
                                life: 80,
                                friendly: true,
                                color: '#a29bfe',
                                pierceRemain: (p.holyLight && hasDog) ? 2 : 0,
                                homing: false,
                                explosive: false,
                                slow: false,
                                burn: false,
                                knockback: false,
                                scythe: false,
                                angle: ang,
                            };
                            game.bullets.push(bullet);
                            pet.shootCooldown = pet.shootDelay || 40;
                        } else {
                            pet.shootCooldown = 10;
                        }
                    }
                }
            }

            // ---- 山羊 ----
            if (p.ramPet && game.ramPet) {
                const pet = game.ramPet;
                const dx = p.x - pet.x;
                const dy = p.y - pet.y;
                const d = Math.hypot(dx, dy);
                if (d > 60 && pet.state === 'idle') {
                    const step = Math.min(pet.speed * 0.5 * dt * 60, d);
                    pet.x += (dx / d) * step;
                    pet.y += (dy / d) * step;
                }
                if (pet.state === 'idle') {
                    pet.chargeTimer -= dt * 60;
                    if (pet.chargeTimer <= 0) {
                        let target = null,
                            minD = Infinity;
                        for (const e of game.enemies) {
                            if (e.hp <= 0) continue;
                            const d2 = dist(pet, e);
                            if (d2 < minD) {
                                minD = d2;
                                target = e;
                            }
                        }
                        if (target && minD < 400) {
                            pet.state = 'charging';
                            pet.target = target;
                            pet.chargeTimer = 50;
                            pet.chargeAngle = Math.atan2(target.y - pet.y, target.x - pet.x);
                        } else {
                            pet.chargeTimer = 60;
                        }
                    }
                } else if (pet.state === 'charging') {
                    if (pet.target && pet.target.hp > 0) {
                        const ang = Math.atan2(pet.target.y - pet.y, pet.target.x - pet.x);
                        const speed = pet.speed * 2;
                        pet.x += Math.cos(ang) * speed * dt * 60;
                        pet.y += Math.sin(ang) * speed * dt * 60;
                        for (const e of game.enemies) {
                            if (e.hp <= 0 || e === pet.target) continue;
                            if (dist(pet, e) < pet.radius + e.radius) {
                                e.hp -= 2;
                                e.hitCooldown = 10;
                                e.hurtTimer = 15;
                                const ang2 = Math.atan2(e.y - pet.y, e.x - pet.x);
                                e.x += Math.cos(ang2) * 15;
                                e.y += Math.sin(ang2) * 15;
                            }
                        }
                        if (pet.target && dist(pet, pet.target) < pet.radius + pet.target.radius) {
                            pet.target.hp -= 3;
                            pet.target.hitCooldown = 10;
                            pet.target.hurtTimer = 15;
                        }
                        pet.chargeTimer -= dt * 60;
                        if (pet.chargeTimer <= 0) {
                            pet.state = 'idle';
                            pet.chargeTimer = p.holyLight ? 90 : 180;
                            pet.target = null;
                        }
                    } else {
                        pet.state = 'idle';
                        pet.chargeTimer = p.holyLight ? 90 : 180;
                        pet.target = null;
                    }
                }
                pet.x = clamp(pet.x, ROOM_PAD + pet.radius, W - ROOM_PAD - pet.radius);
                pet.y = clamp(pet.y, ROOM_PAD + pet.radius, H - ROOM_PAD - pet.radius);
            }

            // ---- 连携：沙漏+磁铁 ----
            if (p.hourglass && p.magnet) {
                const speed = 60;
                for (const item of game.items) {
                    const dx = p.x - item.x;
                    const dy = p.y - item.y;
                    const d = Math.hypot(dx, dy);
                    if (d > 10) {
                        const step = Math.min(speed * dt, d);
                        item.x += (dx / d) * step;
                        item.y += (dy / d) * step;
                    }
                }
            }

            // ---- 连携：渔网+冰霜/灼烧 ----
            if (p.fishingNet) {
                const hasSlow = p.slowBullet;
                const hasBurn = p.burnBullet;
                if (hasSlow || hasBurn) {
                    for (const item of game.items) {
                        for (const e of game.enemies) {
                            if (e.hp <= 0) continue;
                            const d = dist(item, e);
                            if (d < item.radius + e.radius + 30) {
                                if (hasSlow) {
                                    e.slowTimer = 60;
                                }
                                if (hasBurn) {
                                    e.burnTimer = 120;
                                    e.burnDamage = Math.max(1, Math.floor(3));
                                    e.burnTickTimer = 0;
                                }
                            }
                        }
                    }
                }
            }

            // ---- 碰撞 ----
            checkCollisions();

            // ---- 清理死亡敌人（备用） ----
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const e = game.enemies[i];
                if (e.hp <= 0) {
                    if (e.finalPhase1) {
                        startFinalBossPhase2();
                    } else if (e.finalPhase2) {
                        game.finalPhase2Count--;
                        if (game.finalPhase2Count <= 0) {
                            startFinalBossPhase3();
                        }
                    } else if (e.finalPhase3) {
                        victory();
                    } else {
                        if (e.isBoss) {
                            if (p.holyLight && p.fishingNet && Math.random() < 0.5) {
                                spawnSpecialItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                                spawnSpecialItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                            } else {
                                spawnSpecialItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                            }
                        } else {
                            let dropProb = 0.15 + game.wave * 0.005;
                            if (game.wave <= 6) dropProb *= 2;
                            if (game.wave > 40) dropProb *= 0.6;
                            if (Math.random() < dropProb) {
                                spawnItem(e.x + rand(-20, 20), e.y + rand(-20, 20));
                            }
                        }
                    }
                    game.kills++;
                    for (let k = 0; k < 20; k++) {
                        game.particles.push({
                            x: e.x,
                            y: e.y,
                            vx: rand(-5, 5),
                            vy: rand(-5, 5),
                            life: 30 + rand(0, 20),
                            maxLife: 50,
                            radius: rand(2, 6),
                            color: e.color || '#e74c3c',
                        });
                    }
                    game.enemies.splice(i, 1);
                }
            }

            // ---- 波次管理 ----
            if (!game.finalBossActive) {
                if (game.waveActive && game.enemies.length === 0) {
                    if (game.wave >= VICTORY_WAVE) {
                        startFinalBossPhase1();
                    } else {
                        clearWave();
                    }
                }

                if (!game.waveActive && game.waveDelay > 0) {
                    game.waveDelay -= dt * 60;
                    if (game.waveDelay <= 0) {
                        startWave();
                    }
                }
            }

            if (game.announceTimer > 0) {
                game.announceTimer--;
                if (game.announceTimer <= 0) {
                    waveAnnounce.classList.remove('show');
                }
            }

            // ---- UI ----
            updateStatsDisplay();
            updateSpecialBadges();
            let heartsStr = '';
            for (let i = 0; i < p.maxHp; i++) {
                heartsStr += i < p.hp ? '❤️' : '🖤';
            }
            heartDisplay.textContent = heartsStr || '💀';
            waveDisplay.textContent = game.finalBossActive ? '最终Boss' : game.wave;
            killDisplay.textContent = game.kills;

            game.frame++;
        }

        // ---- 渲染 ----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 400);
            grad.addColorStop(0, '#3d3d5c');
            grad.addColorStop(1, '#25253a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let x = ROOM_PAD; x < W - ROOM_PAD; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, ROOM_PAD);
                ctx.lineTo(x, H - ROOM_PAD);
                ctx.stroke();
            }
            for (let y = ROOM_PAD; y < H - ROOM_PAD; y += 40) {
                ctx.beginPath();
                ctx.moveTo(ROOM_PAD, y);
                ctx.lineTo(W - ROOM_PAD, y);
                ctx.stroke();
            }

            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#4a4a6a';
            ctx.fillRect(0, 0, W, ROOM_PAD);
            ctx.fillRect(0, H - ROOM_PAD, W, ROOM_PAD);
            ctx.fillRect(0, 0, ROOM_PAD, H);
            ctx.fillRect(W - ROOM_PAD, 0, ROOM_PAD, H);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(ROOM_PAD, ROOM_PAD, W - ROOM_PAD * 2, H - ROOM_PAD * 2);

            // ---- 火焰尾迹 ----
            if (game.player.holyLight && game.player.burnBullet) {
                for (const trail of game.fireTrails) {
                    ctx.fillStyle = 'rgba(255,69,0,0.3)';
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,165,0,0.2)';
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, 30, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- 道具 ----
            const time = Date.now() / 1000;
            for (const item of game.items) {
                const bob = Math.sin(time * 2 + item.bobPhase) * 3;
                const x = item.x;
                const y = item.y + bob;
                const glow = ctx.createRadialGradient(x, y, 2, x, y, item.radius * 2.5);
                glow.addColorStop(0, item.color + '60');
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, item.radius * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = item.color + '80';
                ctx.shadowBlur = 20;
                ctx.fillStyle = item.color;
                ctx.beginPath();
                ctx.arc(x, y, item.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 8;
                ctx.fillText(item.symbol, x, y + 1);
                ctx.shadowBlur = 0;
            }

            // ---- 敌人 ----
            for (const e of game.enemies) {
                if (e.hp <= 0) continue;
                const x = e.x,
                    y = e.y;
                const hurt = e.hurtTimer > 0;
                const burning = e.burnTimer > 0;

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(x + 3, y + 6, e.radius * 0.9, e.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                const baseColor = hurt ? '#ff6b6b' : (e.color || '#e74c3c');
                const color = burning ? '#ff4500' : baseColor;
                const grad2 = ctx.createRadialGradient(x - 4, y - 4, 3, x, y, e.radius);
                grad2.addColorStop(0, hurt ? '#ff8a8a' : color);
                grad2.addColorStop(1, hurt ? '#cc3333' : (e.color ? darkenColor(e.color) : '#c0392b'));
                ctx.shadowColor = 'rgba(200,50,50,0.4)';
                ctx.shadowBlur = 15;
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                if (e.isSplitter) {
                    ctx.strokeStyle = '#8e44ad';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x + e.radius * 0.6, y);
                    ctx.lineTo(x, y - e.radius * 0.6);
                    ctx.lineTo(x - e.radius * 0.6, y);
                    ctx.lineTo(x, y + e.radius * 0.6);
                    ctx.closePath();
                    ctx.stroke();
                } else if (e.isFanShooter) {
                    ctx.fillStyle = 'rgba(230,126,34,0.3)';
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius * 1.2, -0.4, 0.4);
                    ctx.fill();
                } else if (e.isTankLimit) {
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius * 0.8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = '#95a5a6';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius * 0.4, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (e.isBouncer) {
                    ctx.fillStyle = 'rgba(241,196,15,0.3)';
                    ctx.beginPath();
                    ctx.moveTo(x + e.radius, y);
                    ctx.lineTo(x, y - e.radius);
                    ctx.lineTo(x - e.radius, y);
                    ctx.lineTo(x, y + e.radius);
                    ctx.closePath();
                    ctx.fill();
                }

                if (e.isBoss) {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius + 10, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    let label = e.bossType || 'normal';
                    if (e.finalPhase1) label = '最终Boss P1';
                    else if (e.finalPhase2) label = '最终Boss P2-' + e.bossType;
                    else if (e.finalPhase3) label = '最终Boss P3';
                    ctx.fillText(label, x, y - e.radius - 20);
                }

                const eyeOff = e.isBoss ? 8 : 5;
                const ang = e.angle || 0;
                for (let side = -1; side <= 1; side += 2) {
                    const ex = x + Math.cos(ang + side * 0.5) * eyeOff;
                    const ey = y + Math.sin(ang + side * 0.5) * eyeOff - 1;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(ex, ey, e.isBoss ? 7 : 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#222';
                    ctx.beginPath();
                    ctx.arc(ex + Math.cos(ang) * 3, ey + Math.sin(ang) * 3, e.isBoss ? 3.5 : 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (e.maxHp > 1 || e.isBoss) {
                    const barW = e.radius * 1.8;
                    const barH = e.isBoss ? 6 : 4;
                    const bx = x - barW / 2;
                    const by = y - e.radius - 12;
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(bx, by, barW, barH);
                    ctx.fillStyle = e.isBoss ? '#ffd700' : '#2ed573';
                    ctx.fillRect(bx + 1, by + 1, (barW - 2) * (e.hp / e.maxHp), barH - 2);
                }
            }

            // ---- 玩家子弹 ----
            for (const b of game.bullets) {
                if (b.auraRadius > 0) {
                    ctx.fillStyle = 'rgba(255,255,200,0.15)';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.auraRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,200,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.auraRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (b.hoverTimer > 0) {
                    ctx.strokeStyle = 'rgba(255,215,0,0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (b.scythe) {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.rot || 0);
                    ctx.shadowColor = 'rgba(255,200,50,0.6)';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(0, 0, b.radius * 3, -0.8, 0.8);
                    ctx.strokeStyle = '#ffd93d';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, b.radius * 2, 0.2, 1.2);
                    ctx.strokeStyle = '#ffb300';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(b.radius * 1.5, 0);
                    ctx.strokeStyle = '#8d6e63';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                } else {
                    const grad3 = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.radius + 3);
                    grad3.addColorStop(0, '#fffbe6');
                    grad3.addColorStop(0.5, b.color || '#ffd93d');
                    grad3.addColorStop(1, 'rgba(255,200,50,0.2)');
                    ctx.shadowColor = 'rgba(255,200,80,0.6)';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = grad3;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius + 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    if (b.homing) {
                        ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.radius + 4, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    if (b.explosive) {
                        ctx.strokeStyle = 'rgba(255,165,0,0.4)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.radius + 6, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    if (b.burn) {
                        ctx.fillStyle = 'rgba(255,69,0,0.2)';
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.radius + 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ---- 敌对子弹 ----
            for (const eb of game.enemyBullets) {
                ctx.shadowColor = 'rgba(255,50,50,0.6)';
                ctx.shadowBlur = 15;
                ctx.fillStyle = eb.color || '#ff6b6b';
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(eb.x - 1, eb.y - 1, eb.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                if (eb.homing) {
                    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(eb.x, eb.y, eb.radius + 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (eb.bounce) {
                    ctx.strokeStyle = 'rgba(0,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(eb.x, eb.y, eb.radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ---- 玩家 ----
            const p = game.player;
            const blink = p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0;

            if (!blink) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(p.x + 3, p.y + 6, p.radius * 0.9, p.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                const grad4 = ctx.createRadialGradient(p.x - 5, p.y - 6, 4, p.x, p.y, p.radius);
                grad4.addColorStop(0, '#ffdb8a');
                grad4.addColorStop(0.7, '#f5a623');
                grad4.addColorStop(1, '#d4891b');
                ctx.shadowColor = 'rgba(245,166,35,0.5)';
                ctx.shadowBlur = 25;
                ctx.fillStyle = grad4;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                if (p.hasShield && p.shieldCharges > 0 && p.shieldCooldown <= 0) {
                    ctx.strokeStyle = 'rgba(0,210,255,0.6)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(0,210,255,0.2)';
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 10, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (p.hasShield) {
                    ctx.strokeStyle = 'rgba(100,100,100,0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const ang2 = p.angle || 0;
                for (let side = -1; side <= 1; side += 2) {
                    const ex = p.x + Math.cos(ang2 + side * 0.6) * 6;
                    const ey = p.y + Math.sin(ang2 + side * 0.6) * 5 - 1;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(ex, ey, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2d2d3a';
                    ctx.beginPath();
                    ctx.arc(ex + Math.cos(ang2) * 3, ey + Math.sin(ang2) * 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(ex + Math.cos(ang2 + 0.5) * 2, ey + Math.sin(ang2 + 0.5) * 2 - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.strokeStyle = '#8b5a2b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x + Math.cos(ang2) * 2, p.y + Math.sin(ang2) * 2 + 4, 5, 0.1, Math.PI - 0.1);
                ctx.stroke();

                if (game.frame % 30 < 15) {
                    ctx.fillStyle = 'rgba(100,180,255,0.5)';
                    const tx = p.x + Math.cos(ang2 - 1.2) * 8;
                    const ty = p.y + Math.sin(ang2 - 1.2) * 8 + 4;
                    ctx.beginPath();
                    ctx.ellipse(tx, ty, 2, 4, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- 猎犬 ----
            if (p.petCount > 0) {
                for (const pet of game.pets) {
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(pet.x + 2, pet.y + 4, pet.radius * 0.8, pet.radius * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowColor = 'rgba(162,155,254,0.5)';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#a29bfe';
                    ctx.beginPath();
                    ctx.arc(pet.x, pet.y, pet.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🐕', pet.x, pet.y + 1);
                }
            }

            // ---- 山羊 ----
            if (p.ramPet && game.ramPet) {
                const pet = game.ramPet;
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(pet.x + 4, pet.y + 6, pet.radius * 0.9, pet.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = 'rgba(255,165,0,0.6)';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.arc(pet.x, pet.y, pet.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐐', pet.x, pet.y + 2);
                if (pet.state === 'charging') {
                    ctx.strokeStyle = 'rgba(255,69,0,0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(pet.x, pet.y, pet.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ---- 粒子 ----
            for (const pt of game.particles) {
                const alpha = clamp(pt.life / pt.maxLife, 0, 1);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = pt.color || '#ffd93d';
                ctx.shadowBlur = 10;
                ctx.shadowColor = pt.color + '80';
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius * (0.3 + 0.7 * alpha), 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;

            // ---- 门 ----
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 2;
            const doorW = 60,
                doorH = 12;
            const doors = [
                { x: W / 2 - doorW / 2, y: ROOM_PAD - doorH / 2 },
                { x: W / 2 - doorW / 2, y: H - ROOM_PAD - doorH / 2 },
                { x: ROOM_PAD - doorH / 2, y: H / 2 - doorW / 2 },
                { x: W - ROOM_PAD - doorH / 2, y: H / 2 - doorW / 2 },
            ];
            for (const d of doors) {
                const isOpen = !game.waveActive && !game.over && !game.victory && !game.finalBossActive;
                ctx.fillStyle = isOpen ? 'rgba(46,213,115,0.25)' : 'rgba(255,71,87,0.20)';
                ctx.fillRect(d.x, d.y, d.w || doorW, d.h || doorH);
                ctx.strokeStyle = isOpen ? 'rgba(46,213,115,0.4)' : 'rgba(255,71,87,0.3)';
                ctx.strokeRect(d.x, d.y, d.w || doorW, d.h || doorH);
                ctx.fillStyle = isOpen ? 'rgba(46,213,115,0.5)' : 'rgba(255,71,87,0.4)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const cx = d.x + (d.w || doorW) / 2;
                const cy = d.y + (d.h || doorH) / 2;
                ctx.fillText(isOpen ? '⬡' : '⛌', cx, cy + 1);
            }

            if (!game.over && !game.victory) {
                let infoText = '';
                if (game.finalBossActive) {
                    infoText = `最终Boss 阶段 ${game.finalPhase}`;
                } else if (game.waveActive) {
                    infoText = `剩余 ${game.enemies.length} 个敌人`;
                }
                if (infoText) {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(infoText, W / 2, H - 8);
                }
            }
        }

        function darkenColor(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            r = Math.max(0, r - 40);
            g = Math.max(0, g - 40);
            b = Math.max(0, b - 40);
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        // ---- 游戏循环 ----
        let lastTime = 0;

        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---- 事件监听 ----
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key) ||
                ['w', 'a', 's', 'd'].includes(key) ||
                ['up', 'down', 'left', 'right'].includes(key)) {
                e.preventDefault();
            }
            const map = {
                'w': 'w',
                'a': 'a',
                's': 's',
                'd': 'd',
                'arrowup': 'up',
                'arrowdown': 'down',
                'arrowleft': 'left',
                'arrowright': 'right',
            };
            const k = map[key];
            if (k) game.keys[k] = true;
            if (key === 'r' && (game.over || game.victory)) resetAndRestart();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            const map = {
                'w': 'w',
                'a': 'a',
                's': 's',
                'd': 'd',
                'arrowup': 'up',
                'arrowdown': 'down',
                'arrowleft': 'left',
                'arrowright': 'right',
            };
            const k = map[key];
            if (k) game.keys[k] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            game.mouse.x = (e.clientX - rect.left) * scaleX;
            game.mouse.y = (e.clientY - rect.top) * scaleY;
            game.mouse.x = clamp(game.mouse.x, 0, W);
            game.mouse.y = clamp(game.mouse.y, 0, H);
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                game.mouse.down = true;
                e.preventDefault();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                game.mouse.down = false;
                e.preventDefault();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            game.mouse.down = false;
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // ---- 重新开始 ----
        function resetAndRestart() {
            gameOverOverlay.classList.remove('show');
            victoryOverlay.classList.remove('show');
            resetGame();
            const p = game.player;
            p.hp = 3;
            p.maxHp = 3;
            p.atk = 1;
            p.baseAtk = 1;
            p.speed = PLAYER_SPEED_BASE;
            p.shootDelay = SHOOT_DELAY_BASE;
            p.baseShootDelay = SHOOT_DELAY_BASE;
            p.invincible = 30;
            p.hasShield = false;
            p.shieldCharges = 0;
            p.shieldCooldown = 0;
            p.scytheActive = false;
            p.homing = false;
            p.petCount = 0;
            p.ramPet = false;
            p.slowBullet = false;
            p.explosiveBullet = false;
            p.burnBullet = false;
            p.knockbackBullet = false;
            p.knockbackDamageBonus = 0;
            p.regen = false;
            p.magnet = false;
            p.soyMilk = false;
            p.shortRange = false;
            p.pierceUp = 0;
            p.needle = false;
            p.holyLight = false;
            p.hourglass = false;
            p.fishingNet = false;
            p.basketball = false;
            p.x = W / 2;
            p.y = H / 2;
            game.enemies = [];
            game.bullets = [];
            game.enemyBullets = [];
            game.items = [];
            game.particles = [];
            game.pets = [];
            game.ramPet = null;
            game.fireTrails = [];
            game.kills = 0;
            game.wave = 0;
            game.over = false;
            game.victory = false;
            game.running = true;
            game.waveActive = false;
            game.waveDelay = 30;
            game.availableSpecialTypes = [...ALL_SPECIAL_TYPES];
            game.magnetRange = ITEM_RADIUS;
            game.soyMilk = false;
            game.shortRange = false;
            game.hourglass = false;
            game.fishingNet = false;
            game.basketball = false;
            game.finalBossActive = false;
            game.finalPhase = 0;
            game.finalPhase2Count = 0;
            game.itemLifeTime = ITEM_LIFETIME_DEFAULT;
            giveRandomSpecialItem();
            initPets();
            updateSpecialBadges();
            startWave();
        }

        restartBtn.addEventListener('click', resetAndRestart);
        victoryRestartBtn.addEventListener('click', resetAndRestart);

        // ---- 初始化 ----
        resetGame();
        game.player.invincible = 60;
        game.wave = 0;
        startWave();
        updateSpecialBadges();
        updateStatsDisplay();

        requestAnimationFrame(gameLoop);

        document.addEventListener('blur', () => {
            game.mouse.down = false;
            for (const k in game.keys) game.keys[k] = false;
        });

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        console.log('🎮 以撒的结合 · 终极强化版已启动！ (最终版)');
    </script>
</body>
</html>
